<style>
/* ============================================================
   Δεν φοβόμαστε το αύριο — Erasmus+ KA122, 1ο Γυμνάσιο Λαυρίου
   Design tokens
   ============================================================ */
:root{
  --navy-950:#08122e;
  --navy-900:#0b1a44;
  --navy-800:#122a6b;
  --paper:#eef1f7;
  --card:#ffffff;
  --ink:#0d1734;
  --ink-soft:#44507a;
  --blue:#2a63ff;
  --blue-deep:#1c47c9;
  --sky:#8fb0ff;
  --sky-soft:#c6d5ff;
  --leaf:#2fae6f;
  --gold:#ffc836;
  --display:'Commissioner',-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --body:'Fira Sans',-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --radius:22px;
  --clip:polygon(0 0, calc(100% - 34px) 0, 100% 34px, 100% 100%, 0 100%);
  --shadow:0 18px 50px -18px rgba(8,18,46,.28);
  --wrap:1140px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-wrap:break-word}

/* ---------- πολύ μεγάλες οθόνες (τηλεοράσεις, διαδραστικοί πίνακες) ----------
   Όλη η σελίδα μεγαλώνει αναλογικά, ώστε να διαβάζεται και από απόσταση
   και να μη μένει μια στενή στήλη στη μέση μιας τεράστιας οθόνης. */
@media (min-width:1700px){ html{font-size:18.5px} :root{--wrap:1340px} }
@media (min-width:2200px){ html{font-size:23px}   :root{--wrap:1680px} }
@media (min-width:3000px){ html{font-size:29px}   :root{--wrap:2200px} }
body{
  font-family:var(--body);
  color:var(--ink);
  background:var(--paper);
  line-height:1.65;
  font-size:1.03rem;        /* κλιμακώνεται μαζί με τις μεγάλες οθόνες */
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3,h4{font-family:var(--display);line-height:1.08;text-wrap:balance}
.wrap{max-width:var(--wrap);margin:0 auto;padding-inline:22px}

/* ---------- section rhythm ---------- */
.sec{padding-block:96px}
.sec.dark{background:var(--navy-950);color:#e8edfb}
.sec.dark .eyebrow{color:var(--sky)}
.sec.dark h2{color:#fff}
.eyebrow{
  font-family:var(--display);font-weight:700;font-size:.82rem;
  letter-spacing:.22em;text-transform:uppercase;color:var(--blue-deep);
  display:flex;align-items:center;gap:12px;margin-bottom:18px;
}
.eyebrow::before{content:"";width:34px;height:3px;background:currentColor;border-radius:2px}
h2{font-size:clamp(2rem,4.6vw,3.1rem);font-weight:800;margin-bottom:20px}
.lead{font-size:1.13rem;color:var(--ink-soft);max-width:min(64ch,100%)}
.sec.dark .lead{color:#b9c6ec}

/* ---------- nav ---------- */
.nav{
  position:fixed;inset-inline:0;top:0;z-index:60;
  transition:background .35s,box-shadow .35s,padding .35s;
  padding-block:18px;
}
.nav.scrolled{
  background:rgba(255,255,255,.82);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:0 8px 30px -16px rgba(8,18,46,.25);
  padding-block:10px;
}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none}
.brand-mark{
  width:40px;height:40px;border-radius:13px;flex:none;
  background:linear-gradient(135deg,var(--blue),var(--blue-deep));
  display:grid;place-items:center;color:#fff;font-family:var(--display);
  font-weight:900;font-size:1.05rem;
  clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%);
}
.brand-mark.has-logo{background:#fff;padding:4px;box-shadow:0 6px 18px -12px rgba(8,18,46,.6)}
.brand-mark img{width:100%;height:100%;object-fit:contain;display:block}
.brand-txt{display:flex;flex-direction:column;line-height:1.15}
.brand-txt b{font-family:var(--display);font-weight:800;font-size:.98rem}
.brand-txt span{font-size:.72rem;color:var(--ink-soft);letter-spacing:.06em}
.nav-links{display:flex;align-items:center;gap:26px;list-style:none}
.nav-links a{
  text-decoration:none;font-size:.93rem;font-weight:500;color:var(--ink-soft);
  transition:color .2s;position:relative;
}
.nav-links a::after{
  content:"";position:absolute;left:0;bottom:-6px;width:0;height:2px;
  background:var(--blue);border-radius:2px;transition:width .25s;
}
.nav-links a:hover{color:var(--ink)}
.nav-links a:hover::after{width:100%}
.lang-btn{
  font-family:var(--display);font-weight:700;font-size:.85rem;letter-spacing:.04em;
  border:2px solid var(--blue);color:var(--blue-deep);background:transparent;
  border-radius:999px;padding:7px 16px;cursor:pointer;transition:all .22s;
}
.lang-btn:hover{background:var(--blue);color:#fff}
.burger{display:none;background:var(--blue);border:none;border-radius:999px;width:44px;height:44px;cursor:pointer;place-items:center}
.burger span{display:block;width:18px;height:2px;background:#fff;margin:2.5px auto;border-radius:2px;transition:.25s}

/* ---------- hero ---------- */
.hero{
  position:relative;min-height:640px;
  padding-top:150px;padding-bottom:70px;
  background:
    radial-gradient(1200px 600px at 78% 8%,rgba(42,99,255,.10),transparent 60%),
    var(--paper);
  overflow:hidden;
}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:44px;align-items:center}
.hero-kicker{
  display:inline-flex;align-items:center;gap:10px;
  font-family:var(--display);font-weight:700;font-size:.8rem;letter-spacing:.2em;
  text-transform:uppercase;color:var(--blue-deep);
  background:rgba(42,99,255,.09);border:1px solid rgba(42,99,255,.22);
  padding:8px 16px;border-radius:999px;margin-bottom:26px;
}
.hero-kicker .dot{width:8px;height:8px;border-radius:50%;background:var(--leaf);animation:pulse 2.2s infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.55}}
.hero h1{
  font-size:clamp(1.9rem,6vw,4.35rem);font-weight:900;letter-spacing:-.015em;
  margin-bottom:22px;
}
.hero h1 .accent{color:var(--blue)}
.hero-sub{font-size:1.16rem;color:var(--ink-soft);max-width:min(54ch,100%);margin-bottom:34px}
.cta-row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.btn{
  display:inline-flex;align-items:center;gap:10px;text-decoration:none;
  font-family:var(--display);font-weight:700;font-size:.97rem;
  border-radius:999px;padding:14px 26px;transition:transform .22s,box-shadow .22s,background .22s;
}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 14px 30px -12px rgba(42,99,255,.55)}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 20px 38px -12px rgba(42,99,255,.6)}
.btn-ghost{border:2px solid rgba(13,23,52,.18);color:var(--ink)}
.btn-ghost:hover{border-color:var(--blue);color:var(--blue-deep);transform:translateY(-3px)}
.btn .arr{
  width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.22);
  display:grid;place-items:center;transition:transform .25s;
}
.btn-ghost .arr{background:rgba(42,99,255,.12);color:var(--blue-deep)}
.btn:hover .arr{transform:translateX(3px)}
.hero-art{position:relative}
.hero-art .stage svg{width:100%;height:auto;display:block}
.hero-scroll{
  position:absolute;left:50%;bottom:16px;transform:translateX(-50%);
  font-size:.75rem;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-soft);
  display:flex;flex-direction:column;align-items:center;gap:8px;
}
.hero-scroll::after{
  content:"";width:2px;height:34px;border-radius:2px;
  background:linear-gradient(var(--blue),transparent);
  animation:drip 1.8s infinite;
}
@keyframes drip{0%{transform:scaleY(0);transform-origin:top}55%{transform:scaleY(1);transform-origin:top}56%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* hero svg animation */
.ring{transform-origin:center;animation:spin 46s linear infinite}
.ring.r2{animation-duration:70s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.route{stroke-dasharray:6 7;animation:routeflow 1.4s linear infinite}
@keyframes routeflow{to{stroke-dashoffset:-13}}
.route-reveal{stroke-dashoffset:600;stroke-dasharray:600;animation:draw 2.6s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.ship-g{animation:bob 5.2s ease-in-out infinite;transform-origin:center}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-9px) rotate(1.4deg)}}
.pin-pulse{transform-origin:center;transform-box:fill-box;animation:pinpulse 2.4s ease-out infinite}
@keyframes pinpulse{0%{transform:scale(.4);opacity:.9}80%,100%{transform:scale(2.6);opacity:0}}
.float-slow{animation:floaty 7s ease-in-out infinite}
.float-slow.d2{animation-delay:-3.2s}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

/* ---------- bento ---------- */
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-top:52px}
.tile{
  background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
  border:1px solid rgba(143,176,255,.18);
  border-radius:var(--radius);clip-path:var(--clip);
  padding:30px 26px;position:relative;overflow:hidden;
  transition:transform .3s,border-color .3s,background .3s;
}
.tile:hover{transform:translateY(-6px);border-color:rgba(143,176,255,.45)}
.tile .num{
  font-family:var(--display);font-weight:900;font-size:clamp(2.4rem,4vw,3.4rem);
  color:#fff;line-height:1;font-variant-numeric:tabular-nums;
  display:flex;align-items:baseline;gap:4px;
}
.tile .num .suf{font-size:1.5rem;color:var(--sky)}
.tile .lbl{margin-top:10px;color:#b9c6ec;font-size:.95rem;line-height:1.45}
.tile.wide{grid-column:span 2}
.tile.accent{background:linear-gradient(150deg,var(--blue),var(--blue-deep));border-color:transparent}
.tile.accent .lbl{color:#dfe8ff}
.tile.leaf{background:linear-gradient(150deg,#177a4b,#0e5c37);border-color:transparent}
.tile.leaf .lbl{color:#d2f2e1}
.tile .tico{position:absolute;right:18px;top:18px;opacity:.5}

/* ---------- goals ---------- */
.goals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:48px}
.goal{
  background:rgba(255,255,255,.04);border:1px solid rgba(143,176,255,.16);
  border-radius:var(--radius);clip-path:var(--clip);padding:30px 26px;
  transition:transform .3s,border-color .3s;
}
.goal:hover{transform:translateY(-6px);border-color:rgba(143,176,255,.4)}
.goal .gico{
  width:52px;height:52px;border-radius:16px;display:grid;place-items:center;
  background:rgba(42,99,255,.18);color:var(--sky);margin-bottom:18px;
}
.goal h3{color:#fff;font-size:1.14rem;font-weight:700;margin-bottom:10px}
.goal p{color:#b9c6ec;font-size:.95rem}

/* ---------- timeline ---------- */
.tl{position:relative;margin-top:60px;padding-left:6px}
.tl::before{
  content:"";position:absolute;left:var(--tl-x,26px);top:var(--tl-top,8px);width:3px;border-radius:3px;
  height:var(--tl-h,calc(100% - 16px));
  background:linear-gradient(var(--blue),var(--sky-soft));
}
.tl-item{position:relative;padding-left:74px;padding-bottom:44px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{
  position:absolute;left:13px;top:2px;width:29px;height:29px;border-radius:50%;
  background:var(--card);border:3px solid var(--blue);
  display:grid;place-items:center;font-family:var(--display);font-weight:800;
  font-size:.8rem;color:var(--blue-deep);z-index:1;
}
.tl-item.done .tl-dot{background:var(--blue);color:#fff}
.tl-date{
  font-family:var(--display);font-weight:700;font-size:.8rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--blue-deep);margin-bottom:6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
}
.tl-flag{font-size:1rem;letter-spacing:0}
.tl-item h3{font-size:1.22rem;font-weight:800;margin-bottom:8px}
.tl-item p{color:var(--ink-soft);max-width:min(62ch,100%);font-size:.98rem}
.tl-kind{
  font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 10px;border-radius:999px;background:rgba(42,99,255,.1);color:var(--blue-deep);
}
.k-host  .tl-kind{background:rgba(224,75,63,.12);color:#c0271d}
.k-trip  .tl-kind{background:rgba(42,99,255,.12);color:var(--blue-deep)}
.k-train .tl-kind{background:rgba(139,92,246,.14);color:#6d3fe0}
.k-prep  .tl-kind{background:rgba(13,23,52,.07);color:#44507a}
.k-event .tl-kind{background:rgba(15,148,99,.14);color:#0b7d52}
.tl-next-tag{
  font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 10px;border-radius:999px;background:var(--blue);color:#fff;
}
.tl-dot svg{display:block}
.k-host  .tl-dot{border-color:#e04b3f;color:#c0271d}
.k-train .tl-dot{border-color:#8b5cf6;color:#6d3fe0}
.k-event .tl-dot{border-color:#0f9463;color:#0b7d52}
.tl-item.done .tl-dot{background:var(--blue);border-color:var(--blue);color:#fff}
.k-host.done  .tl-dot{background:#e04b3f;border-color:#e04b3f}
.k-train.done .tl-dot{background:#8b5cf6;border-color:#8b5cf6}
.k-event.done .tl-dot{background:#0f9463;border-color:#0f9463}
.tl-meta{margin-top:8px;font-size:.86rem;color:var(--blue-deep);font-weight:500}
.tl-ics{
  display:inline-flex;align-items:center;gap:7px;margin-top:12px;
  font-size:.82rem;font-weight:600;color:var(--blue-deep);text-decoration:none;
  border:1px solid rgba(42,99,255,.28);border-radius:999px;padding:6px 14px;
  transition:background .25s,border-color .25s;
}
.tl-ics:hover{background:rgba(42,99,255,.08);border-color:rgba(42,99,255,.5)}
.tl-item.done{opacity:.72}

/* πορεία του έργου */
.tl-prog{margin-top:30px;max-width:520px}
.tl-prog-top{display:flex;justify-content:space-between;align-items:baseline;gap:14px;margin-bottom:8px}
.tl-prog-top span{font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.tl-prog-top b{font-family:var(--display);font-weight:800;color:var(--blue-deep);font-size:.95rem}
.tl-prog-bar{height:8px;border-radius:99px;background:rgba(42,99,255,.14);overflow:hidden}
.tl-prog-bar i{display:block;height:100%;border-radius:99px;width:0;background:linear-gradient(90deg,var(--blue),var(--leaf));transition:width 1.2s var(--ease)}

/* ---------- φίλτρο έργου στις δράσεις ---------- */
.act-filter{display:flex;gap:10px;flex-wrap:wrap;margin-top:34px}
.act-filter button{
  font-family:var(--body);font-size:.88rem;font-weight:600;cursor:pointer;
  background:transparent;color:#b9c6ec;border:1px solid rgba(143,176,255,.28);
  border-radius:999px;padding:8px 18px;transition:background .25s,color .25s,border-color .25s;
}
.act-filter button:hover{color:#fff;border-color:rgba(143,176,255,.6)}
.act-filter button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.act-filter button b{font-weight:600;opacity:.65;margin-left:6px;font-size:.8rem}
.act-proj{
  display:inline-block;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;
  color:#9fb2e0;border:1px solid rgba(143,176,255,.3);border-radius:999px;padding:2px 9px;
}

/* ---------- activity cards ---------- */
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin-top:52px}
.act{
  background:var(--navy-900);border:1px solid rgba(143,176,255,.16);
  border-radius:var(--radius);clip-path:var(--clip);overflow:hidden;
  display:flex;flex-direction:column;transition:transform .32s,border-color .32s,box-shadow .32s;
}
.act:hover{transform:translateY(-8px);border-color:rgba(143,176,255,.45);box-shadow:0 26px 50px -20px rgba(0,0,0,.55)}
.act-media{position:relative;aspect-ratio:16/9.4;max-width:100%;overflow:hidden;flex:none}
.act-media img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.act:hover .act-media img{transform:scale(1.06)}
.ph{
  width:100%;height:100%;display:grid;place-items:center;gap:0;
  background:
    radial-gradient(300px 160px at 30% 20%,rgba(143,176,255,.25),transparent),
    linear-gradient(150deg,#16295f,#0b1a44);
  color:#8fa5df;
}
.ph .ph-in{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase}
.act-body{padding:24px 24px 26px;display:flex;flex-direction:column;gap:12px;flex:1}
.act-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.act-cat{
  font-size:.7rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  padding:4px 12px;border-radius:999px;border:1px solid;
}
.cat-nea{color:var(--sky);border-color:rgba(143,176,255,.5)}
.cat-drasi{color:#63d99e;border-color:rgba(99,217,158,.5)}
.cat-taxidi{color:var(--gold);border-color:rgba(255,200,54,.5)}
.act-date{font-size:.82rem;color:#8ba0d8;font-variant-numeric:tabular-nums}
.act h3{color:#fff;font-size:1.18rem;font-weight:700;line-height:1.3}
.act p{color:#b9c6ec;font-size:.93rem;flex:1}
.act .more{
  color:var(--sky);font-family:var(--display);font-weight:700;font-size:.88rem;
  text-decoration:none;display:inline-flex;align-items:center;gap:7px;margin-top:4px;
}
.act .more svg{transition:transform .25s}
.act .more:hover svg{transform:translateX(4px)}

/* ---------- history (Εμένα με νοιάζει) ---------- */
.hist{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:center;margin-top:20px}
.hist-card{
  background:var(--card);border-radius:var(--radius);clip-path:var(--clip);
  box-shadow:var(--shadow);padding:38px 34px;position:relative;
}
.hist-badge{
  display:inline-flex;align-items:center;gap:8px;font-size:.72rem;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;color:#0e7a48;
  background:rgba(47,174,111,.13);border:1px solid rgba(47,174,111,.35);
  padding:5px 13px;border-radius:999px;margin-bottom:16px;
}
.hist-card h3{font-size:1.5rem;font-weight:800;margin-bottom:14px}
.hist-card p{color:var(--ink-soft);font-size:.98rem;margin-bottom:14px}
.hist-stats{display:flex;gap:26px;margin-top:22px;flex-wrap:wrap}
.hstat b{font-family:var(--display);font-weight:900;font-size:1.7rem;color:var(--blue-deep);display:block;line-height:1.1}
.hstat span{font-size:.82rem;color:var(--ink-soft)}
.hist-links{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}
.chip-link{
  display:inline-flex;align-items:center;gap:8px;text-decoration:none;
  font-size:.87rem;font-weight:600;color:var(--blue-deep);
  border:1.5px solid rgba(42,99,255,.35);border-radius:999px;padding:8px 16px;
  transition:background .2s,color .2s;
}
.chip-link:hover{background:var(--blue);color:#fff}
.flags-row{display:flex;gap:10px;margin-top:8px;font-size:1.6rem}

/* ---------- partners ---------- */
.partners{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:50px}
.partner{
  background:rgba(255,255,255,.04);border:1px solid rgba(143,176,255,.16);
  border-radius:var(--radius);clip-path:var(--clip);padding:30px 26px;text-align:left;
  transition:transform .3s,border-color .3s;
}
.partner:hover{transform:translateY(-6px);border-color:rgba(143,176,255,.4)}
.partner .pflag{font-size:2.1rem;line-height:1;margin-bottom:14px}
.partner h3{color:#fff;font-size:1.1rem;font-weight:700;margin-bottom:6px}
.partner p{color:#b9c6ec;font-size:.9rem}
.partner .soon{
  display:inline-block;margin-top:12px;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--gold);background:rgba(255,200,54,.12);border:1px solid rgba(255,200,54,.35);
  padding:3px 10px;border-radius:999px;
}

/* ---------- gallery ---------- */
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:210px;gap:16px;margin-top:50px}
.gal-item{
  border-radius:18px;overflow:hidden;position:relative;cursor:default;
  clip-path:polygon(0 0,calc(100% - 24px) 0,100% 24px,100% 100%,0 100%);
}
.gal-item.big{grid-row:span 2}
.gal-item img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.gal-item.has-img{cursor:zoom-in}
.gal-item.has-img:hover img{transform:scale(1.07)}
.gal-cap{
  position:absolute;inset-inline:0;bottom:0;padding:14px 16px 12px;font-size:.8rem;color:#fff;
  background:linear-gradient(transparent,rgba(8,18,46,.85));
  opacity:0;transition:opacity .3s;
}
.gal-item.has-img:hover .gal-cap{opacity:1}
.lightbox{
  position:fixed;inset:0;z-index:100;background:rgba(8,18,46,.92);
  display:none;place-items:center;padding:30px;cursor:zoom-out;
}
.lightbox.open{display:grid}
.lightbox img{max-width:min(1000px,92vw);max-height:84vh;border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.lightbox .lb-cap{position:absolute;bottom:26px;inset-inline:0;text-align:center;color:#c9d6f7;font-size:.9rem}
.lightbox .lb-nav{
  position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;
  border:none;background:rgba(255,255,255,.13);color:#fff;cursor:pointer;display:none;
  place-items:center;transition:background .2s;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.lightbox.multi .lb-nav{display:grid}
.lightbox .lb-nav:hover{background:var(--blue)}
.lightbox .lb-prev{left:22px}
.lightbox .lb-next{right:22px}
@media (max-width:660px){
  .lightbox .lb-nav{width:42px;height:42px}
  .lightbox .lb-prev{left:8px}.lightbox .lb-next{right:8px}
}
.lightbox .lb-x{
  position:absolute;top:20px;right:24px;width:44px;height:44px;border-radius:50%;
  border:none;background:rgba(255,255,255,.12);color:#fff;font-size:1.3rem;cursor:pointer;
}

/* ---------- footer ---------- */
footer{background:var(--navy-950);color:#b9c6ec;padding-block:130px 34px}
.foot-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:44px;margin-bottom:50px}
.foot-grid h2{color:#fff;font-size:1rem;font-weight:700;margin-bottom:16px;line-height:1.3}
.foot-grid p,.foot-grid a{font-size:.92rem;color:#b9c6ec;text-decoration:none;line-height:1.9}
.foot-grid a:hover{color:#fff}
.eu-box{
  display:flex;align-items:center;gap:16px;background:rgba(255,255,255,.05);
  border:1px solid rgba(143,176,255,.18);border-radius:16px;padding:16px 18px;margin-top:8px;
}
.eu-box svg{flex:none;border-radius:4px}
.eu-box p{font-size:.8rem;line-height:1.5;color:#c9d6f7}
.foot-note{
  border-top:1px solid rgba(143,176,255,.15);padding-top:22px;
  display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;
  font-size:.8rem;color:#7e91c5;
}
.disclaimer{font-size:.78rem;color:#7e91c5;max-width:min(78ch,100%);margin-top:12px;line-height:1.65}

/* ---------- motion & transitions ---------- */
:root{--ease:cubic-bezier(.16,1,.3,1)}

/* hero entrance choreography */
.hero-kicker,.hero h1,.hero-sub,.cta-row{animation:heroUp .95s var(--ease) both}
.hero h1{animation-delay:.14s}
.hero-sub{animation-delay:.3s}
.cta-row{animation-delay:.46s}
.hero-art .stage svg{animation:artIn 1.2s var(--ease) .25s both}
.nav{animation:navIn .8s var(--ease) .05s both}
@keyframes heroUp{from{opacity:0;transform:translateY(38px)}to{opacity:1;transform:none}}
@keyframes artIn{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}
@keyframes navIn{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}

/* hero title: lines rise out of a mask */
#heroTitle .tr{display:block;overflow:hidden;padding-bottom:.08em;margin-bottom:-.08em}
#heroTitle .tri{display:inline-block;animation:lineUp 1.05s var(--ease) both}
#heroTitle .tr:nth-child(1) .tri{animation-delay:.18s}
#heroTitle .tr:nth-child(2) .tri{animation-delay:.3s}
@keyframes lineUp{from{transform:translateY(112%) rotate(1.5deg)}to{transform:none}}

/* reveal on scroll — slower, weightier, custom ease */
.js .rv{opacity:.001;transform:translateY(42px);transition:opacity 1.05s var(--ease),transform 1.05s var(--ease)}
.js .rv.in{opacity:1;transform:none}
.js .rv.d1{transition-delay:.09s}.js .rv.d2{transition-delay:.18s}.js .rv.d3{transition-delay:.27s}

/* section headings: text slides up from behind a mask */
h2.rv{overflow:hidden}
.js h2 .tri{display:inline-block;transform:translateY(115%);transition:transform 1.15s var(--ease) .08s}
.js h2.in .tri{transform:none}

/* eyebrow line grows in */
.js .eyebrow.rv::before{transform:scaleX(0);transform-origin:left;transition:transform .8s var(--ease) .25s}
.js .eyebrow.rv.in::before{transform:scaleX(1)}

/* cards: rise + settle from slight scale */
.js .goal.rv,.js .tile.rv,.js .partner.rv,.js .act.rv{transform:translateY(46px) scale(.965)}
.js .goal.rv.in,.js .tile.rv.in,.js .partner.rv.in,.js .act.rv.in{transform:none}

/* activity media: navy curtain wipes away */
.act-media::after{
  content:"";position:absolute;inset:0;z-index:2;
  background:linear-gradient(120deg,#1c3a8f,#0b1a44);
  transform:scaleX(1);transform-origin:right;
  transition:transform 1s cubic-bezier(.7,0,.2,1) .25s;
}
.js .act.in .act-media::after{transform:scaleX(0)}

/* gallery: pop-in with scale */
.js .gal-item.rv{transform:translateY(34px) scale(.94)}
.js .gal-item.rv.in{transform:none}

/* timeline: the line fills as you scroll, dots pop */
.tl::before{transform:scaleY(var(--tlp,0));transform-origin:top;will-change:transform}
.js .tl-item .tl-dot{transform:scale(0);transition:transform .55s cubic-bezier(.34,1.56,.64,1) .15s}
.js .tl-item.in .tl-dot{transform:scale(1)}
.js .tl-item{transform:translateX(30px);}
.js .tl-item.in{transform:none}

/* ---------- responsive ---------- */
@media (max-width:1000px){
  .hero .wrap{grid-template-columns:minmax(0,1fr);gap:30px}
  .hero{padding-top:120px}
  .hero-art{max-width:560px;margin-inline:auto}
  .bento{grid-template-columns:repeat(2,minmax(0,1fr))}
  .goals,.acts,.partners{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hist{grid-template-columns:minmax(0,1fr)}
  .gal{grid-template-columns:repeat(2,minmax(0,1fr))}
  .foot-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
}
@media (max-width:660px){
  .sec{padding-block:70px}
  .nav-links{
    position:fixed;inset-inline:14px;top:70px;flex-direction:column;gap:4px;
    background:rgba(255,255,255,.97);border-radius:20px;box-shadow:var(--shadow);
    padding:18px;display:none;
  }
  .nav-links.open{display:flex}
  .nav-links a{display:block;padding:10px 14px;font-size:1rem}
  .burger{display:grid}
  .bento,.goals,.acts,.partners{grid-template-columns:minmax(0,1fr)}
  .tile.wide{grid-column:auto}
  .gal{grid-template-columns:minmax(0,1fr);grid-auto-rows:230px}
  .gal-item.big{grid-row:auto}
  .foot-grid{grid-template-columns:minmax(0,1fr)}
  .hero-scroll{display:none}
}
/* ---------- λογότυπα ---------- */
.hero-logos{display:flex;gap:16px;align-items:center;margin-top:34px;flex-wrap:wrap}
.hero-logos img{height:46px;width:auto;display:block}
/* το σήμα του σχολείου είναι ψηλόστενο — του δίνουμε περισσότερο ύψος */
.hero-logos .logo-school img{height:74px}
.hero-logos .logo-school{padding:6px 12px}
.hero-logos .logo-card{background:#fff;border-radius:12px;padding:8px 14px;box-shadow:0 10px 26px -14px rgba(8,18,46,.3)}
.fund-logo{margin-bottom:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.fund-logo img{height:54px;width:auto;background:#fff;border-radius:10px;padding:7px 12px}
.fund-logo img.iky{height:58px;padding:5px 7px}
.fund-logo img.eplus{height:46px;padding:8px 12px}
.eu-box.is-img{display:block;background:none;border:0;padding:0}
.eu-box.is-img img{width:100%;max-width:280px;height:auto;background:#fff;border-radius:10px;padding:8px 10px}

/* ---------- υπόμνημα προορισμών ---------- */
.legend{margin-top:14px}
.legend-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.legend-row+.legend-row{margin-top:8px}
.legend-lbl{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin-right:2px}
@media(max-width:640px){
  .legend-lbl{flex:0 0 100%;text-align:center;margin:0 0 2px}
  .legend-row+.legend-row{margin-top:14px}
}
.legend-chip{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--card);border:1px solid rgba(13,23,52,.09);border-radius:999px;
  padding:6px 14px 6px 8px;font-size:.86rem;font-weight:500;
  box-shadow:0 8px 22px -16px rgba(8,18,46,.55);
}
.legend-chip i{width:8px;height:8px;border-radius:50%;flex:none}
.legend-chip b{font-weight:500;margin-left:2px}
.legend-chip svg+svg{margin-left:-2px}
.legend-note{
  margin-top:10px;text-align:center;font-size:.76rem;color:var(--ink-soft);
  display:flex;gap:16px;justify-content:center;flex-wrap:wrap;
}
.legend-note span{display:inline-flex;align-items:center;gap:6px}
.legend-note i{width:7px;height:7px;border-radius:50%;display:inline-block}

/* ---------- βάθος 3D στη σκηνή του hero ---------- */
.hero-art{perspective:1200px;perspective-origin:50% 45%}
.hero-art .stage{
  position:relative;
  transform:rotateX(var(--tiltX,0deg)) rotateY(var(--tiltY,0deg));
  transform-style:preserve-3d;
  transition:transform .5s cubic-bezier(.22,1,.36,1);
}
.hero-art .stage svg{position:relative;z-index:1;display:block}
.globe-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.hero-art .pl{
  transform:translate3d(calc(var(--px,0) * var(--d,0) * 1px), calc(var(--py,0) * var(--d,0) * 1px), 0);
  transition:transform .55s cubic-bezier(.22,1,.36,1);
}
.travellers circle{filter:drop-shadow(0 0 6px currentColor)}

/* ---------- κάρτες με κλίση 3D και ανάκλαση ---------- */
.act,.gal-item{
  transform:perspective(1000px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty,0px)) scale(var(--sc,1));
  transform-style:preserve-3d;
}
.act:hover,.gal-item:hover{--ty:-8px}
.act::after,.gal-item::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:3;border-radius:inherit;
  background:radial-gradient(340px circle at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.16),transparent 62%);
  opacity:0;transition:opacity .35s;
}
.act:hover::after,.gal-item:hover::after{opacity:1}
.act{position:relative}

/* ---------- απαλή λάμψη που ακολουθεί τον κέρσορα στις σκούρες ενότητες ---------- */
.sec.dark{position:relative;isolation:isolate}
.sec.dark::before{
  content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(620px circle at var(--sx,50%) var(--sy,20%),rgba(42,99,255,.13),transparent 68%);
  opacity:0;transition:opacity .6s;
}
.sec.dark:hover::before{opacity:1}
.sec.dark .wrap{position:relative;z-index:1}

@media (prefers-reduced-motion:reduce){
  .hero-art .stage svg,.hero-art .pl{transform:none!important}
  .act,.gal-item{transform:none!important}
  .sec.dark::before{display:none}
}

/* ---------- προσβασιμότητα ---------- */
.sr-only{
  position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
}
.skip{
  position:fixed;top:-100px;left:16px;z-index:120;
  background:var(--blue);color:#fff;text-decoration:none;
  font-family:var(--display);font-weight:700;font-size:.95rem;
  padding:12px 22px;border-radius:0 0 14px 14px;transition:top .2s;
}
.skip:focus{top:0}
.act.clickable:focus-visible,.gal-item:focus-visible{outline:3px solid var(--sky);outline-offset:4px}

/* ---------- σημείωμα για φωτογραφίες και δεδομένα ---------- */
.privacy{
  margin-top:22px;border-top:1px solid rgba(143,176,255,.15);padding-top:20px;
}
.privacy summary{
  cursor:pointer;font-family:var(--display);font-weight:700;font-size:.9rem;
  color:#b9c6ec;list-style:none;display:flex;align-items:center;gap:10px;
  padding:4px 0;transition:color .2s;
}
.privacy summary:hover{color:#fff}
.privacy summary::-webkit-details-marker{display:none}
.privacy summary::before{
  content:"";width:7px;height:7px;border-right:2px solid var(--sky);
  border-bottom:2px solid var(--sky);transform:rotate(-45deg);transition:transform .25s;flex:none;
}
.privacy[open] summary::before{transform:rotate(45deg)}
.privacy p{
  font-size:.85rem;line-height:1.7;color:#8ba0d8;max-width:min(80ch,100%);margin-top:14px;
}

/* ---------- ποιότητα αέρα ---------- */
.air{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px;margin-top:50px}
.air-card{
  background:rgba(255,255,255,.045);border:1px solid rgba(143,176,255,.18);
  border-radius:var(--radius);clip-path:var(--clip);padding:28px 26px;
  transition:transform .3s,border-color .3s;
}
.air-card:hover{transform:translateY(-5px);border-color:rgba(143,176,255,.4)}
.air-city{
  display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;
  font-size:1.05rem;color:#fff;margin-bottom:18px;
}
.air-val{display:flex;align-items:baseline;gap:9px}
.air-val b{
  font-family:var(--display);font-weight:900;font-size:2.9rem;color:#fff;line-height:1;
  font-variant-numeric:tabular-nums;
}
.air-val span{font-size:.8rem;color:#8ba0d8;letter-spacing:.1em;text-transform:uppercase}
.air-band{
  display:inline-flex;align-items:center;gap:9px;margin-top:16px;
  font-size:.82rem;font-weight:600;color:#dfe8ff;
  background:rgba(255,255,255,.06);border:1px solid rgba(143,176,255,.22);
  padding:6px 14px;border-radius:999px;
}
.air-band i{width:10px;height:10px;border-radius:50%;flex:none}
.air-pm{margin-top:14px;font-size:.86rem;color:#b9c6ec}
.air-pm b{color:#fff;font-weight:600;font-variant-numeric:tabular-nums}
.air-note{margin-top:26px;font-size:.84rem;color:#8ba0d8;max-width:min(78ch,100%);line-height:1.6}
.air-skel{height:150px;border-radius:var(--radius);background:rgba(143,176,255,.06);
  animation:shimmer 1.5s linear infinite;
  background-image:linear-gradient(90deg,rgba(143,176,255,.05),rgba(143,176,255,.16),rgba(143,176,255,.05));
  background-size:220% 100%}

/* ---------- μετράμε το αποτύπωμα ---------- */
.imp{margin-top:56px}
.imp h3,.brg h3{
  font-family:var(--display);font-weight:800;color:#fff;
  font-size:clamp(1.3rem,2.4vw,1.75rem);margin-bottom:10px;
}
.imp > p,.brg > p{color:#b9c6ec;font-size:.98rem;max-width:min(66ch,100%);margin-bottom:26px}
.imp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.imp-card{
  background:rgba(255,255,255,.05);border:1px solid rgba(143,176,255,.2);
  border-radius:var(--radius);clip-path:var(--clip);padding:22px 22px 20px;
}
.imp-card b{
  font-family:var(--display);font-weight:900;font-size:2rem;color:#63d99e;
  display:block;line-height:1.1;font-variant-numeric:tabular-nums;
}
.imp-card b.waiting{color:#6d80b4}
.imp-card span{font-size:.88rem;color:#b9c6ec;display:block;margin-top:4px}
.imp-bar{height:6px;border-radius:99px;background:rgba(143,176,255,.22);margin-top:14px;overflow:hidden}
.imp-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#2fae6f,#63d99e);width:0;transition:width 1.1s var(--ease)}
.imp-goal{font-size:.74rem;color:#8ea3d6;margin-top:7px;display:block}

/* ---------- τι φέρνουμε πίσω ---------- */
.brg{margin-top:56px}
.brg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.brg-card{
  position:relative;overflow:hidden;padding:14px 16px 18px;
  background:rgba(255,255,255,.05);border:1px solid rgba(143,176,255,.2);
  border-radius:var(--radius);clip-path:var(--clip);
}
.brg-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,#63d99e);z-index:2}
.brg-art{display:block;border-radius:12px;overflow:hidden;line-height:0;margin-bottom:14px}
.brg-art svg{display:block;width:100%;height:118px}
.brg-top{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.brg-top b{color:#fff;font-weight:600;font-size:.92rem}
.brg-card h4{
  font-family:var(--display);font-weight:800;color:#fff;
  font-size:1.04rem;line-height:1.3;margin-bottom:8px;
}
.brg-card p{color:#b9c6ec;font-size:.9rem;line-height:1.65;margin:0}
.brg-tag{
  display:inline-block;font-family:var(--display);font-weight:700;
  font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--c,#63d99e);
  background:rgba(255,255,255,.07);border:1px solid rgba(143,176,255,.2);
  padding:4px 10px;border-radius:999px;
}
.brg-ph{display:block;margin-top:12px}
.brg-ph i{display:block;height:8px;border-radius:99px;background:rgba(143,176,255,.14);margin-top:9px}
.brg-ph i:nth-child(2){width:88%}
.brg-ph i:nth-child(3){width:62%}
}

/* ---------- αντίστροφη μέτρηση πάνω από την υδρόγειο ---------- */
.cd{
  display:block;text-decoration:none;color:inherit;position:relative;
  background:var(--card);border:1px solid rgba(42,99,255,.2);
  border-radius:var(--radius);clip-path:var(--clip);
  padding:18px 22px 16px;margin-bottom:18px;
  box-shadow:0 18px 44px -26px rgba(8,18,46,.55);
  transition:transform .3s var(--ease),border-color .3s,box-shadow .3s;
}
.cd:hover{transform:translateY(-3px);border-color:rgba(42,99,255,.45);box-shadow:0 26px 54px -26px rgba(8,18,46,.6)}
.cd-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.cd-flags{display:inline-flex;align-items:center;gap:7px;color:var(--blue)}
.cd-flags svg{display:block}
.cd-lbl{
  font-family:var(--display);font-weight:700;font-size:.66rem;letter-spacing:.16em;
  text-transform:uppercase;color:#fff;background:var(--blue);border-radius:999px;padding:5px 12px;
}
.cd-title{display:block;font-family:var(--display);font-weight:800;font-size:1.08rem;line-height:1.25}
.cd-when{display:block;font-size:.84rem;color:var(--ink-soft);margin-top:4px}
.ct-clock{display:flex;align-items:flex-end;gap:6px;margin-top:14px}
.ct-cell{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  background:linear-gradient(160deg,rgba(42,99,255,.12),rgba(42,99,255,.05));
  border-radius:12px;padding:8px 4px 6px;min-width:60px;flex:1;
}
.ct-cell b{
  font-family:var(--display);font-weight:900;font-size:1.6rem;line-height:1;
  color:var(--blue-deep);font-variant-numeric:tabular-nums;
}
.ct-cell i{font-style:normal;font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.ct-sep{align-self:center;color:rgba(42,99,255,.4);font-weight:800;padding-bottom:12px}
.cd-go{
  display:inline-flex;align-items:center;gap:6px;margin-top:12px;
  font-size:.82rem;font-weight:600;color:var(--blue-deep);
}
.cd-go svg{transition:transform .25s}
.cd:hover .cd-go svg{transform:translateX(4px)}
@media (max-width:1000px){ .cd{margin-bottom:22px} }
@media (max-width:420px){
  .ct-cell{min-width:0;padding:7px 2px 5px}
  .ct-cell b{font-size:1.3rem}
  .ct-cell i{font-size:.58rem;letter-spacing:.04em}
}

/* ---------- ταινία φωτογραφιών ---------- */
.strip{
  margin-top:40px;overflow:hidden;position:relative;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);
}
.strip-row{display:flex;gap:14px;width:max-content;animation:stripRun 40s linear infinite}
.strip:hover .strip-row,.strip:focus-within .strip-row{animation-play-state:paused}
@keyframes stripRun{from{transform:translateX(0)}to{transform:translateX(calc(-50% - 7px))}}
.strip-item{
  flex:none;width:190px;height:118px;padding:0;border:0;border-radius:14px;overflow:hidden;
  background:var(--navy-800);cursor:pointer;position:relative;
  clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%);
  transition:transform .3s var(--ease),filter .3s;filter:saturate(.92);
}
.strip-item img{width:100%;height:100%;object-fit:cover;display:block}
.strip-item:hover,.strip-item:focus-visible{transform:translateY(-4px) scale(1.02);filter:saturate(1.1)}
.strip-item:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
@media (max-width:640px){ .strip-item{width:150px;height:95px} }
@media (prefers-reduced-motion:reduce){
  .strip-row{animation:none}
  .strip{overflow-x:auto}
}

/* ---------- κύματα στο υποσέλιδο ---------- */
footer{position:relative;overflow:hidden}
.foot-waves{position:absolute;left:0;right:0;top:0;height:110px;pointer-events:none;overflow:hidden}
.foot-waves svg{display:block;width:260%;height:110px}
.foot-waves path{fill:#16295f}
.foot-waves .w-back{fill:rgba(42,99,255,.30);animation:waveX 26s linear infinite}
.foot-waves .w-mid{fill:rgba(60,120,255,.22);animation:waveX 18s linear infinite reverse}
.foot-waves .w-front{fill:rgba(99,217,158,.16);animation:waveX 13s linear infinite}
@keyframes waveX{from{transform:translateX(0)}to{transform:translateX(-38.4615%)}}
footer .wrap{position:relative;z-index:1}
@media (max-width:700px){ footer{padding-block:96px 30px} .foot-waves,.foot-waves svg{height:80px} }
@media (prefers-reduced-motion:reduce){ .foot-waves path{animation:none} }

/* ---------- μίνι χάρτης που ακολουθεί τους σταθμούς ---------- */
.tl-layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:46px;align-items:start}
.tl-map{position:sticky;top:96px}
.tl-map-in{
  position:relative;background:var(--card);border:1px solid rgba(13,23,52,.08);
  border-radius:var(--radius);clip-path:var(--clip);padding:16px 16px 12px;
  box-shadow:0 18px 44px -30px rgba(8,18,46,.5);
}
.tl-map canvas{display:block;width:100%;height:270px}
.tl-map-lbl{
  display:flex;align-items:center;gap:9px;margin-top:8px;min-height:26px;
  font-family:var(--display);font-weight:700;font-size:.92rem;color:var(--ink);
}
.tl-map-lbl svg{display:block;flex:none}
.tl-map-lbl .lbl-flags{display:inline-flex;align-items:center;gap:5px;color:var(--blue)}
.tl-map-lbl small{font-weight:500;font-size:.8rem;color:var(--ink-soft);font-family:var(--body)}
@media (max-width:1100px){
  .tl-layout{grid-template-columns:minmax(0,1fr);gap:0}
  .tl-map{display:none}
}

/* ---------- ταξίδι πάνω στη γραμμή του χρόνου ---------- */
.tl-travel{position:absolute;left:var(--tl-x,26px);top:var(--tl-top,8px);height:var(--tl-h,0);width:3px;pointer-events:none;z-index:2}
.tl-fill{
  position:absolute;left:0;top:0;width:3px;border-radius:3px;height:0;
  background:linear-gradient(var(--blue-deep),var(--leaf));
  transition:height 1.8s cubic-bezier(.33,1,.68,1);
}
.tl-fill{overflow:hidden}
.tl-spark{
  position:absolute;left:0;width:3px;height:46px;border-radius:3px;
  background:linear-gradient(transparent,rgba(255,255,255,.85),transparent);
  animation:tlSpark 3.6s ease-in-out infinite;
}
@keyframes tlSpark{0%{top:-46px;opacity:0}12%{opacity:.9}88%{opacity:.9}100%{top:100%;opacity:0}}
.tl-head{
  position:absolute;left:50%;top:0;width:11px;height:11px;border-radius:50%;
  transform:translate(-50%,-50%);background:var(--leaf);
  box-shadow:0 0 0 4px rgba(47,174,111,.22);
  transition:top 1.8s cubic-bezier(.33,1,.68,1);
  animation:tlPulse 2.4s ease-in-out infinite;
}
@keyframes tlPulse{
  0%,100%{box-shadow:0 0 0 4px rgba(47,174,111,.22)}
  50%{box-shadow:0 0 0 9px rgba(47,174,111,.05)}
}

/* ---------- το δεντράκι λικνίζεται ---------- */
.fp-tree svg{transform-origin:50% 95%;animation:treeSway 6.5s ease-in-out infinite}
@keyframes treeSway{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
.fp-tree{position:relative}
.fp-leaf{
  position:absolute;left:50%;top:38%;width:13px;height:13px;color:#63d99e;
  animation:leafFall 9s linear infinite;opacity:0;pointer-events:none;
}
.fp-leaf:nth-of-type(2){animation-delay:4.5s;left:42%;top:30%}
@keyframes leafFall{
  0%{opacity:0;transform:translate(0,0) rotate(0)}
  8%{opacity:.9}
  70%{opacity:.9}
  100%{opacity:0;transform:translate(-26px,120px) rotate(220deg)}
}
@media (prefers-reduced-motion:reduce){
  .fp-tree svg,.fp-leaf,.tl-head,.tl-spark{animation:none}
  .tl-spark{display:none}
  .fp-leaf{display:none}
}

/* ο σταθμός που ανοίγει από την αντίστροφη μέτρηση αναβοσβήνει μία φορά */
.tl-item.flash{animation:tlFlash 2.2s var(--ease)}
@keyframes tlFlash{
  0%,100%{background:transparent}
  15%,60%{background:rgba(42,99,255,.09)}
}
.tl-item{border-radius:14px;transition:background .4s}

/* ---------- αντίστροφη μέτρηση για την επόμενη κινητικότητα ---------- */
.countdown{
  display:inline-flex;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap;
  background:var(--card);border:1px solid rgba(42,99,255,.22);border-radius:999px;
  padding:8px 20px 8px 10px;box-shadow:0 14px 34px -22px rgba(8,18,46,.5);
}
.ct-lbl{
  font-family:var(--display);font-weight:700;font-size:.66rem;letter-spacing:.16em;
  text-transform:uppercase;color:#fff;background:var(--blue);border-radius:999px;padding:5px 12px;
}
.ct-txt{font-size:.95rem;color:var(--ink)}
.ct-txt b{font-family:var(--display);font-weight:900;font-size:1.2rem;color:var(--blue-deep)}
@media (max-width:520px){ .countdown{padding:10px 16px 10px 10px} .ct-txt{font-size:.88rem} }

/* ---------- υλικό, αποτελέσματα και ημερολόγια ---------- */
.res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px;margin-top:34px}
.res{
  background:var(--card);border:1px solid rgba(13,23,52,.08);border-radius:var(--radius);
  clip-path:var(--clip);padding:24px 24px 22px;display:flex;flex-direction:column;gap:10px;
  text-decoration:none;color:inherit;
  transition:transform .3s var(--ease),box-shadow .3s,border-color .3s;
}
.res:hover{transform:translateY(-4px);border-color:rgba(42,99,255,.32);box-shadow:0 22px 44px -26px rgba(8,18,46,.5)}
.res-ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(42,99,255,.1);color:var(--blue-deep);flex:none}
.res h4{font-family:var(--display);font-weight:800;font-size:1.06rem;line-height:1.25}
.res p{font-size:.92rem;color:var(--ink-soft);flex:1}
.res-meta{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-deep);font-weight:600}
.res-h{font-family:var(--display);font-size:clamp(1.3rem,2.4vw,1.7rem);font-weight:800;margin:60px 0 10px}
.diaries{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;margin-top:28px}
.diary{
  background:linear-gradient(150deg,rgba(47,174,111,.10),rgba(42,99,255,.07));
  border:1px solid rgba(99,217,158,.32);border-radius:var(--radius);clip-path:var(--clip);
  padding:26px 26px 22px;
}
.diary q{font-size:1.02rem;line-height:1.7;display:block;quotes:"«" "»"}
.diary footer{margin-top:14px;font-size:.84rem;color:var(--ink-soft);display:flex;gap:10px;flex-wrap:wrap}
.res-empty{
  margin-top:26px;padding:26px;border:1px dashed rgba(13,23,52,.16);border-radius:var(--radius);
  color:var(--ink-soft);font-size:.95rem;max-width:min(70ch,100%);
}

/* ---------- σήμανση αυτόματης μετάφρασης ---------- */
.mt-tag{
  display:inline-block;margin-top:10px;font-size:.7rem;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-soft);
  border:1px solid rgba(13,23,52,.12);border-radius:999px;padding:2px 9px;
}
.reader-content .mt-tag{margin:0 0 14px;color:#b9c6ec;border-color:rgba(185,198,236,.35)}

/* ---------- αποτύπωμα της ίδιας της σελίδας ---------- */
.fp{
  margin-top:64px;background:linear-gradient(150deg,rgba(47,174,111,.16),rgba(42,99,255,.10));
  border:1px solid rgba(99,217,158,.3);border-radius:var(--radius);clip-path:var(--clip);
  padding:34px 32px;
}
.fp h3{color:#fff;font-size:1.35rem;font-weight:800;margin-bottom:12px}
.fp > p{color:#b9c6ec;font-size:.98rem;max-width:min(66ch,100%);margin-bottom:26px}
.fp-nums{display:flex;gap:44px;flex-wrap:wrap}
.fp-num b{
  font-family:var(--display);font-weight:900;font-size:2.2rem;color:#63d99e;
  display:block;line-height:1.1;font-variant-numeric:tabular-nums;
}
.fp-num span{font-size:.85rem;color:#b9c6ec}
.fp small{display:block;margin-top:24px;font-size:.78rem;color:#7e91c5;line-height:1.6;max-width:min(70ch,100%)}
.fp-grid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:38px;align-items:center}
.fp-tree{text-align:center}
.fp-tree svg{display:block;margin:0 auto}
.fp-tree em{
  display:block;margin-top:8px;font-style:normal;font-size:.76rem;color:#b9c6ec;max-width:min(19ch,100%);
}
.fp-tree .lf{transform-box:fill-box;transform-origin:center;animation:leafPop .6s var(--ease) both}
@keyframes leafPop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@media (max-width:760px){
  .fp-grid{grid-template-columns:minmax(0,1fr);gap:24px}
  .fp-tree{justify-self:start;text-align:left}
  .fp-tree svg{margin:0}
}
@media (prefers-reduced-motion:reduce){ .fp-tree .lf{animation:none;opacity:1} }

@media (max-width:1000px){ .air{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:660px){
  .air{grid-template-columns:minmax(0,1fr)}
  .fp-nums{gap:26px}
}
@media (max-width:1200px){
  .nav-links{gap:17px}
  .nav-links a{font-size:.87rem}
}

/* ---------- κάρτα «τελευταία δράση» στο hero ---------- */
.latest{
  display:inline-flex;align-items:center;gap:14px;margin-top:26px;cursor:pointer;
  background:var(--card);border:1px solid rgba(13,23,52,.08);border-radius:999px;
  padding:8px 20px 8px 8px;box-shadow:0 14px 34px -20px rgba(8,18,46,.5);
  font-family:var(--body);text-align:left;max-width:100%;
  transition:transform .25s var(--ease),box-shadow .25s,border-color .25s;
}
.latest:hover{transform:translateY(-3px);border-color:rgba(42,99,255,.35);box-shadow:0 20px 42px -20px rgba(8,18,46,.55)}
.latest-thumb{width:48px;height:48px;border-radius:50%;overflow:hidden;flex:none;background:var(--navy-800)}
.latest-thumb img{width:100%;height:100%;object-fit:cover}
.latest-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.latest-lbl{
  font-family:var(--display);font-weight:700;font-size:.68rem;letter-spacing:.16em;
  text-transform:uppercase;color:var(--blue-deep);
}
.latest-title{
  font-size:.95rem;font-weight:500;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:min(34ch,100%);
}
.latest-arr{color:var(--blue);display:grid;place-items:center;flex:none;transition:transform .25s}
.latest:hover .latest-arr{transform:translateX(4px)}

/* ---------- σύνδεσμος «Επόμενο» ---------- */
.next-link{
  display:flex;align-items:center;gap:14px;margin-top:64px;cursor:pointer;
  background:none;border:none;border-top:1px solid rgba(13,23,52,.12);
  padding:26px 4px 0;width:100%;text-align:left;font-family:var(--body);
  transition:gap .25s;
}
.sec.dark .next-link{border-top-color:rgba(143,176,255,.2)}
.next-link:hover{gap:20px}
.next-lbl{
  font-family:var(--display);font-weight:700;font-size:.72rem;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink-soft);
}
.sec.dark .next-lbl{color:var(--sky)}
.next-name{
  font-family:var(--display);font-weight:800;font-size:clamp(1.25rem,2.6vw,1.85rem);
  color:var(--ink);flex:1;
}
.sec.dark .next-name{color:#fff}
.next-arr{
  width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:var(--blue);color:#fff;transition:transform .25s;
}
.next-link:hover .next-arr{transform:translateX(5px)}

/* ---------- «εδώ βρισκόμαστε» στο χρονολόγιο ---------- */
.tl-now{
  display:inline-flex;align-items:center;gap:7px;font-size:.7rem;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;color:#0e7a48;
  background:rgba(47,174,111,.15);border:1px solid rgba(47,174,111,.4);
  padding:3px 11px;border-radius:999px;
}
.tl-now i{width:7px;height:7px;border-radius:50%;background:var(--leaf);animation:pulse 2s infinite}
.tl-item.now .tl-dot{border-color:var(--leaf);background:var(--leaf);color:#fff;box-shadow:0 0 0 5px rgba(47,174,111,.18)}

/* ---------- κατάσταση φόρτωσης ---------- */
.act.skel{pointer-events:none;opacity:.75}
.act.skel .act-body{gap:10px}
.skel-line{
  display:block;height:11px;border-radius:6px;
  background:linear-gradient(90deg,rgba(143,176,255,.10),rgba(143,176,255,.26),rgba(143,176,255,.10));
  background-size:220% 100%;animation:shimmer 1.5s linear infinite;
}
@keyframes shimmer{from{background-position:220% 0}to{background-position:-220% 0}}

/* ---------- διάταξη «παράθυρα» ---------- */
body.panels [data-panel]{display:none}
body.panels [data-panel].live{display:block}
body.panels .hero{min-height:min(78vh,760px)}
body.panels .hero-scroll{display:none}
body.panels [data-panel="top"].live{animation:panelIn .5s var(--ease) both}
@keyframes panelIn{from{opacity:0}to{opacity:1}}
/* όταν το ενεργό panel είναι σκούρο, το μενού γίνεται ανοιχτόχρωμο */
body.dark-top .nav:not(.scrolled) .brand-txt b{color:#fff}
body.dark-top .nav:not(.scrolled) .brand-txt span{color:#9fb2e0}
body.dark-top .nav:not(.scrolled) .nav-links a{color:#b9c6ec}
body.dark-top .nav:not(.scrolled) .nav-links a:hover,
body.dark-top .nav:not(.scrolled) .nav-links a.here{color:#fff}
body.dark-top .nav:not(.scrolled) .lang-btn{border-color:var(--sky);color:#dfe8ff}
body.dark-top .nav:not(.scrolled) .lang-btn:hover{background:var(--sky);color:var(--navy-950)}
.nav-links a.here{color:var(--ink)}
.nav-links a.here::after{width:100%}
.panel-back{
  display:none;align-items:center;gap:9px;background:none;border:none;cursor:pointer;
  font-family:var(--display);font-weight:700;font-size:.9rem;color:var(--blue-deep);
  padding:0;margin-bottom:26px;transition:gap .2s;
}
body.panels .sec.live .panel-back{display:inline-flex}
.sec.dark .panel-back{color:var(--sky)}
.panel-back:hover{gap:14px}

/* ---------- αναγνώστης ανάρτησης (reader) ---------- */
.act.clickable{cursor:pointer}
.reader{
  position:fixed;inset:0;z-index:95;display:none;overflow-y:auto;
  background:rgba(8,18,46,.74);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  padding:0 18px 70px;
}
.reader.open{display:block}
.reader-sheet{
  max-width:790px;margin:76px auto 0;background:var(--navy-900);color:#dfe7fb;
  border:1px solid rgba(143,176,255,.2);border-radius:26px;
  clip-path:polygon(0 0,calc(100% - 46px) 0,100% 46px,100% 100%,0 100%);
  overflow:hidden;box-shadow:0 40px 90px -30px rgba(0,0,0,.7);
  animation:sheetIn .65s var(--ease) both;
}
@keyframes sheetIn{from{opacity:0;transform:translateY(46px) scale(.985)}to{opacity:1;transform:none}}
.reader-hero{aspect-ratio:16/8;max-width:100%;overflow:hidden;background:var(--navy-800)}
.reader-hero img{width:100%;height:100%;object-fit:cover}
.reader-body{padding:36px 40px 44px}
.reader-meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.reader-body h2{color:#fff;font-size:clamp(1.55rem,3.4vw,2.25rem);margin-bottom:24px}
.reader-content{font-size:1.02rem;line-height:1.82;color:#c3cfee}
.reader-content p,.reader-content div{margin-bottom:16px}
.reader-content p:last-child{margin-bottom:0}
.reader-content strong,.reader-content b{color:#fff;font-weight:600}
.reader-content h2,.reader-content h3,.reader-content h4{color:#fff;margin:26px 0 12px;font-size:1.2rem}
.reader-content ul,.reader-content ol{margin:0 0 16px 22px}
.reader-content li{margin-bottom:7px}
.reader-content blockquote{
  border-left:3px solid var(--blue);padding-left:18px;margin:22px 0;color:#a9bce8;font-style:italic;
}
.reader-content a{color:var(--sky);text-decoration:underline;text-underline-offset:3px}
.reader-content img{border-radius:14px;margin:24px 0;width:100%;height:auto}
.reader-content .vid{
  position:relative;aspect-ratio:16/9;max-width:100%;margin:24px 0;
  border-radius:14px;overflow:hidden;background:#000;
}
.reader-content .vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.reader-src{
  margin-top:32px;padding-top:20px;border-top:1px solid rgba(143,176,255,.18);
  font-size:.86rem;color:#8ba0d8;
}
.reader-src a{color:var(--sky);text-decoration:none}
.reader-src a:hover{text-decoration:underline}
.reader-x{
  position:fixed;top:22px;right:24px;z-index:96;width:48px;height:48px;border-radius:50%;
  border:none;background:rgba(255,255,255,.15);color:#fff;font-size:1.35rem;cursor:pointer;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:background .2s;
}
.reader-x:hover{background:var(--blue)}
.feed-note{
  margin-top:28px;font-size:.87rem;color:#8ba0d8;line-height:1.6;
  border:1px dashed rgba(143,176,255,.32);border-radius:14px;padding:14px 18px;
}
@media (max-width:660px){
  .reader-sheet{margin-top:64px;border-radius:20px;clip-path:polygon(0 0,calc(100% - 30px) 0,100% 30px,100% 100%,0 100%)}
  .reader-body{padding:26px 22px 32px}
  .reader-x{top:14px;right:14px;width:42px;height:42px}
}

/* ---------- curtain page transition (3 στυλ: panels / wave / mosaic) ---------- */
.curtain{position:fixed;inset:0;z-index:90;pointer-events:none}
.curtain.cover{pointer-events:all}
.curtain:not(.m-panels) .c-panels{display:none}
.curtain:not(.m-wave) .c-wave{display:none}
.curtain:not(.m-mosaic) .c-mosaic{display:none}

/* panels */
.c-panels{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.c-panels i{display:block;transform:scaleY(0);transform-origin:bottom}
.c-panels i:nth-child(1){background:var(--navy-900)}
.c-panels i:nth-child(2){background:linear-gradient(180deg,var(--blue),var(--blue-deep))}
.c-panels i:nth-child(3){background:var(--navy-950)}
.curtain.cover .c-panels i{transform:scaleY(1);transition:transform .55s cubic-bezier(.76,0,.24,1)}
.curtain.cover .c-panels i:nth-child(2){transition-delay:.07s}
.curtain.cover .c-panels i:nth-child(3){transition-delay:.14s}
.curtain.open .c-panels i{transform:scaleY(0);transform-origin:top;transition:transform .6s cubic-bezier(.76,0,.24,1)}
.curtain.open .c-panels i:nth-child(2){transition-delay:.06s}
.curtain.open .c-panels i:nth-child(3){transition-delay:.12s}

/* wave */
.c-wave{position:absolute;inset:0;width:100%;height:100%}
.c-wave .w1{fill:var(--navy-950)}
.c-wave .w2{fill:var(--blue)}

/* mosaic */
.c-mosaic{
  position:absolute;inset:0;display:grid;
  grid-template-columns:repeat(16,minmax(0,1fr));grid-auto-rows:1fr;
}
.c-mosaic{perspective:900px}
.c-mosaic i{
  display:block;transform-style:preserve-3d;
  transform:scale(.35) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));opacity:0;border-radius:50%;
  background:var(--navy-950);
  transition:transform .72s cubic-bezier(.22,1,.36,1),opacity .6s ease,border-radius .72s cubic-bezier(.22,1,.36,1);
}
.c-mosaic i.blue{background:var(--blue)}
.c-mosaic i.deep{background:var(--navy-900)}
.curtain.cover .c-mosaic i{transform:scale(1.18) rotateX(0deg) rotateY(0deg);opacity:1;border-radius:0}
.curtain.open .c-mosaic i{transform:scale(.35) rotateX(var(--rx2,0deg)) rotateY(var(--ry2,0deg));opacity:0;border-radius:50%}
.curtain-label{
  position:absolute;inset:0;display:grid;place-items:center;
  color:#fff;font-family:var(--display);font-weight:900;
  font-size:clamp(2.2rem,7vw,4.6rem);letter-spacing:-.01em;
  opacity:0;transform:translateY(28px);
  transition:opacity .3s ease,transform .5s var(--ease);
}
.curtain.cover .curtain-label{opacity:1;transform:none;transition-delay:.28s}
.curtain.open .curtain-label{opacity:0;transform:translateY(-22px);transition-delay:0s}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  html{scroll-behavior:auto}
  .js .rv,.js .tl-item{opacity:1;transform:none}
  .js h2 .tri{transform:none}
  .js .tl-item .tl-dot{transform:scale(1)}
  .act-media::after{display:none}
  .tl::before{transform:scaleY(1)}
}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:6px}
</style>

function icsHref(ev, title){

/* Η γραμμή του χρόνου ευθυγραμμίζεται ακριβώς με τα κέντρα των σημάνσεων και
   γεμίζει όσο έχει προχωρήσει ο πραγματικός χρόνος. Οι μετρήσεις γίνονται μόνο
   όταν η ενότητα είναι ορατή — αλλιώς όλα τα ύψη είναι μηδενικά.            */
function travelLine(box){
  var old = box.querySelector('.tl-travel');
  if (old) old.remove();
  var items = Array.prototype.slice.call(box.querySelectorAll('.tl-item'));
  if (items.length < 2) return;

  var wrap = el('span', 'tl-travel');
  wrap.setAttribute('aria-hidden', 'true');
  wrap.innerHTML = '<i class="tl-fill"><b class="tl-spark"></b></i><span class="tl-head" hidden></span>';
  box.appendChild(wrap);

  var fillEl = wrap.querySelector('.tl-fill'), headEl = wrap.querySelector('.tl-head');

  function measure(animate){
    if (!box.offsetHeight) return false;                  // κρυφό πάνελ: δεν μετριέται
    var dotOf = function(node){ return node.querySelector('.tl-dot'); };
    var cy = function(node){
      var d = dotOf(node);
      return node.offsetTop + (d ? d.offsetTop + d.offsetHeight / 2 : 16);
    };
    var d0 = dotOf(items[0]);
    var cx = d0 ? items[0].offsetLeft + d0.offsetLeft + d0.offsetWidth / 2 : 27;
    var top = cy(items[0]), bottom = cy(items[items.length - 1]);

    box.style.setProperty('--tl-x', (cx - 1.5) + 'px');   // η γραμμή περνά από το κέντρο
    box.style.setProperty('--tl-top', top + 'px');
    box.style.setProperty('--tl-h', (bottom - top) + 'px');

    var now = Date.now(), marks = [];
    items.forEach(function(node, i){
      var t = TIMELINE[i], a = dparse(t.from), b = dparse(t.to) || a;
      if (a) marks.push({ y: cy(node), start: a.getTime(), end: b.getTime() + 86400000 });
    });
    var fill = 0, show = false;
    if (marks.length && now >= marks[0].start){
      if (now >= marks[marks.length - 1].end) fill = bottom - top;
      else for (var i = 0; i < marks.length; i++){
        var m = marks[i], nx = marks[i + 1];
        if (now <= m.end){ fill = m.y - top; break; }                  // μέσα στη δράση:
        if (nx && now < nx.start){                                     // η ίδια η σήμανση
          show = true;                                                 // δείχνει το «τώρα»
          fill = (m.y + (nx.y - m.y) * ((now - m.end) / (nx.start - m.end))) - top;
          break;                                                       // ανάμεσα σε δύο:
        }                                                              // δείχνουμε το σημάδι
      }
    }
    fill = Math.max(0, Math.min(bottom - top, fill));

    headEl.hidden = !show;
    if (!animate){ fillEl.style.transition = 'none'; headEl.style.transition = 'none'; }
    fillEl.style.height = fill + 'px';
    headEl.style.top = fill + 'px';
    if (!animate) requestAnimationFrame(function(){
      fillEl.style.transition = ''; headEl.style.transition = '';
    });
    return true;
  }

  /* πρώτη φορά: γεμίζει με κίνηση μόλις φανεί η ενότητα */
  var done = false;
  var first = function(){
    if (done) return;
    fillEl.style.height = '0'; headEl.style.top = '0';
    requestAnimationFrame(function(){ done = measure(true); });
  };
  if ('IntersectionObserver' in window && !box.offsetHeight){
    var ob = new IntersectionObserver(function(en){
      en.forEach(function(e){ if (e.isIntersecting){ setTimeout(first, 200); ob.disconnect(); } });
    }, { threshold: 0.05 });
    ob.observe(box);
  } else {
    setTimeout(first, 200);
  }
  clearTimeout(travelLine.rt);
  window.addEventListener('resize', function(){
    clearTimeout(travelLine.rt);
    travelLine.rt = setTimeout(function(){ measure(false); }, 220);
  });
}

/* ---------- ο μίνι χάρτης δίπλα στο χρονολόγιο ----------
   Δείχνει την Ευρώπη με κουκκίδες, το Λαύριο και τους προορισμούς. Καθώς
   κυλάτε τους σταθμούς, σχεδιάζεται η διαδρομή της χώρας του σταθμού.   */
var MAP_PTS = null, mapActive = null, mapAnim = 0, mapRaf = 0, mapPainted = false;
var mapDir = 'out', mapT0 = 0, mapSeen = false;   // 'out' = πάμε, 'in' = έρχονται
var mapBase = null, mapBaseKey = '';
function mapPoints(){
  if (MAP_PTS) return MAP_PTS;
  var bin = atob(EUROPE), out = [];
  var dx = (EU_LON1 - EU_LON0) / EU_NX, dy = (EU_LAT1 - EU_LAT0) / EU_NY;
  for (var iy = 0; iy < EU_NY; iy++){
    for (var ix = 0; ix < EU_NX; ix++){
      var i = iy * EU_NX + ix;
      if (!(bin.charCodeAt(i >> 3) & (1 << (i & 7)))) continue;
      out.push([EU_LON0 + (ix + 0.5) * dx, EU_LAT1 - (iy + 0.5) * dy]);
    }
  }
  MAP_PTS = out;
  return out;
}
/* από το διάνυσμα της πόλης πίσω σε γεωγραφικό μήκος/πλάτος */
function cityLL(v){
  return [Math.atan2(-v[2], v[0]) * 180 / Math.PI, Math.asin(v[1]) * 180 / Math.PI];
}
function drawMiniMap(){
  var cv = document.getElementById('tlMapCv');
  if (!cv || !cv.offsetWidth) return;
  var ctx = cv.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var W = cv.offsetWidth, H = cv.offsetHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  /* το κάδρο προκύπτει από τις ίδιες τις πόλεις, με περιθώριο για τις ετικέτες */
  var lls = CITIES.map(function(c){ return cityLL(c.v); });
  var lon0 = Math.min.apply(null, lls.map(function(l){ return l[0]; })) - 5;
  var lon1 = Math.max.apply(null, lls.map(function(l){ return l[0]; })) + 5;
  var lat0 = Math.min.apply(null, lls.map(function(l){ return l[1]; })) - 4;
  var lat1 = Math.max.apply(null, lls.map(function(l){ return l[1]; })) + 4;
  var padL = 16, padR = 16, padT = 14, padB = 14;
  var lonC = (lon0 + lon1) / 2, latC = (lat0 + lat1) / 2;
  var cosf = Math.cos(latC * Math.PI / 180);
  var k = Math.min((W - padL - padR) / ((lon1 - lon0) * cosf),
                   (H - padT - padB) / (lat1 - lat0));
  var cxm = padL + (W - padL - padR) / 2, cym = padT + (H - padT - padB) / 2;
  var P = function(lon, lat){
    return [cxm + (lon - lonC) * cosf * k, cym - (lat - latC) * k];
  };

  /* η ξηρά ζωγραφίζεται μία φορά και μετά αντιγράφεται */
  var key = W + 'x' + H + 'x' + dpr;
  if (mapBaseKey !== key){
    mapBase = document.createElement('canvas');
    mapBase.width = cv.width; mapBase.height = cv.height;
    var bx = mapBase.getContext('2d');
    bx.setTransform(dpr, 0, 0, dpr, 0, 0);
    bx.fillStyle = 'rgba(42,99,255,.20)';
    mapPoints().forEach(function(p){
      var q = P(p[0], p[1]);
      if (q[0] < -2 || q[0] > W + 2 || q[1] < -2 || q[1] > H + 2) return;
      bx.beginPath(); bx.arc(q[0], q[1], 0.95, 0, 6.2832); bx.fill();
    });
    mapBaseKey = key;
  }
  ctx.drawImage(mapBase, 0, 0, W, H);

  var home = CITIES[0], hq = P.apply(null, cityLL(home.v));
  var bez = function(a, cpt, b, t){
    var u = 1 - t;
    return [u*u*a[0] + 2*u*t*cpt[0] + t*t*b[0], u*u*a[1] + 2*u*t*cpt[1] + t*t*b[1]];
  };
  CITIES.slice(1).forEach(function(c){
    var q = P.apply(null, cityLL(c.v));
    var on = mapActive === c;
    var cpt = [(hq[0] + q[0]) / 2, (hq[1] + q[1]) / 2 - 34];
    /* η φορά της γραμμής δείχνει ποιος ταξιδεύει: εμείς προς τα εκεί ή αυτοί προς εμάς */
    var A = (on && mapDir === 'in') ? q : hq;
    var B = (on && mapDir === 'in') ? hq : q;

    ctx.strokeStyle = c.c;
    ctx.lineWidth = on ? 2.2 : 1.2;
    ctx.globalAlpha = on ? 1 : 0.22;
    ctx.lineCap = 'round';
    if (on){ ctx.setLineDash([320, 320]); ctx.lineDashOffset = 320 * (1 - mapAnim); }
    ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.quadraticCurveTo(cpt[0], cpt[1], B[0], B[1]); ctx.stroke();
    ctx.setLineDash([]);

    if (on && mapAnim > 0.55){
      /* βελάκι στο σημείο άφιξης */
      var tip = B, tt = 1;
      for (var st = 1; st >= 0.5; st -= 0.01){        // σταματά 11px πριν την πινέζα
        var pt = bez(A, cpt, B, st);
        if (Math.hypot(B[0] - pt[0], B[1] - pt[1]) >= 11){ tip = pt; tt = st; break; }
      }
      var e0 = bez(A, cpt, B, Math.max(0, tt - 0.06));
      var ang = Math.atan2(tip[1] - e0[1], tip[0] - e0[0]);
      ctx.globalAlpha = Math.min(1, (mapAnim - 0.55) / 0.35);
      ctx.fillStyle = c.c;
      ctx.save();
      ctx.translate(tip[0], tip[1]); ctx.rotate(ang);
      ctx.beginPath(); ctx.moveTo(2, 0); ctx.lineTo(-8, 4.6); ctx.lineTo(-8, -4.6); ctx.closePath(); ctx.fill();
      ctx.restore();
      /* φως που ταξιδεύει στη σωστή κατεύθυνση */
      var ph = ((mapNow / 1900) % 1);
      var pv = bez(A, cpt, B, ph);
      ctx.globalAlpha = 0.9 * Math.sin(Math.PI * ph);
      ctx.fillStyle = c.c;
      ctx.beginPath(); ctx.arc(pv[0], pv[1], 3.2, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = 0.18 * Math.sin(Math.PI * ph);
      ctx.beginPath(); ctx.arc(pv[0], pv[1], 8, 0, 6.2832); ctx.fill();
    }

    ctx.globalAlpha = on ? 1 : 0.35;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(q[0], q[1], on ? 6 : 4.2, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = c.c; ctx.lineWidth = on ? 2.6 : 1.8;
    ctx.beginPath(); ctx.arc(q[0], q[1], on ? 6 : 4.2, 0, 6.2832); ctx.stroke();
    ctx.globalAlpha = 1;
  });

  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(hq[0], hq[1], 6, 0, 6.2832); ctx.fill();
  ctx.strokeStyle = home.c; ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.arc(hq[0], hq[1], 6, 0, 6.2832); ctx.stroke();
  ctx.fillStyle = home.t || home.c;
  ctx.font = '700 11px Commissioner, system-ui, sans-serif';
  var nm = T(home.name), tw = ctx.measureText(nm).width;
  var left = hq[0] + 10 + tw > W - 4;               // αν δεν χωρά δεξιά, πάει αριστερά

  ctx.fillText(nm, hq[0] + (left ? -10 : 10), hq[1] + 4);
  mapPainted = true;
}
function setMapCity(city, flag, title, kind){
  var lbl = document.getElementById('tlMapLbl');
  var dir = (kind === 'host') ? 'in' : 'out';
  var key = (flag || '') + '|' + dir;
  if (mapPainted && mapActive === city && lbl && lbl.dataset.k === key) return;
  mapActive = city;
  mapDir = dir;
  if (lbl){
    lbl.dataset.k = key;
    /* οι σημαίες δείχνουν τη φορά: ποιος ταξιδεύει προς ποιον */
    var flags = '';
    if (flag && flag !== 'gr' && flag !== 'eu'){
      flags = (dir === 'in' ? FLAG(flag, 22) + ICONS.arrow + FLAG('gr', 22)
                            : FLAG('gr', 22) + ICONS.arrow + FLAG(flag, 22));
    } else if (flag){
      flags = FLAG(flag, 22);
    }
    lbl.innerHTML = '<span class="lbl-flags">' + flags + '</span>' +
      '<span>' + esc(city ? T(city.name) : T(STRINGS.h_tl)) +

/* Ο βρόχος τρέχει μόνο όσο ο χάρτης είναι στην οθόνη. */
var mapNow = 0;
function mapFrame(now){
  mapRaf = 0;
  if (!mapSeen || document.hidden) return;
  mapNow = now;
  if (!mapT0) mapT0 = now;
  mapAnim = Math.min(1, (now - mapT0) / 700);
  drawMiniMap();
  mapRaf = requestAnimationFrame(mapFrame);
}
function startMapLoop(){
  if (!mapRaf && mapSeen) mapRaf = requestAnimationFrame(mapFrame);
}
function watchTimeline(box){
  var map = document.getElementById('tlMap');
  if (!map || !('IntersectionObserver' in window)) return;
  var byFlag = {};
  CITIES.forEach(function(c, i){ byFlag[['gr','dk','es','de','pt'][i]] = c; });
  var ob = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if (!e.isIntersecting) return;
      var i = parseInt(e.target.id.replace('tl-', ''), 10);
      var t = TIMELINE[i];
      if (!t) return;
      setMapCity(byFlag[t.flag] || null, t.flag, S('k_' + t.kind), t.kind);
    });
  }, { rootMargin: '-45% 0px -45% 0px', threshold: 0 });
  box.querySelectorAll('.tl-item').forEach(function(n){ ob.observe(n); });
  /* ο χάρτης ζωγραφίζεται μόλις η ενότητα γίνει ορατή (πριν είναι κρυφή και δεν μετριέται) */
  var vis = new IntersectionObserver(function(en){
    en.forEach(function(e){
      mapSeen = e.isIntersecting;
      if (mapSeen) startMapLoop();
    });
  }, { threshold: 0.05 });
  vis.observe(map);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) startMapLoop(); });
  var first = TIMELINE[0];
  setMapCity(byFlag[first.flag] || null, first.flag, S('k_' + first.kind), first.kind);
  window.addEventListener('resize', function(){ mapBaseKey = ''; startMapLoop(); });
}

/* η αντίστροφη μέτρηση παίρνει μόνη της το επόμενο γεγονός με ημερομηνία */
function nextEvent(){
  var now = today0(), best = null;
  TIMELINE.forEach(function(t){
    var a = dparse(t.from);
    if (!a || a < now) return;
    if (t.kind !== 'host' && t.kind !== 'trip' && t.kind !== 'train') return;   // μόνο ταξίδια και φιλοξενίες
    if (!best || a < dparse(best.from)) best = t;
  });
  return best;
}
/* ---------- δράσεις: χειροκίνητες + αυτόματες από το WordPress ---------- */
var wpPosts = [];

function norm(str){

}
function allActs(){

/* ---------- φίλτρο: νέο έργο / προηγούμενο / όλα ---------- */
var actScope = '', actScopeUser = false;   // ό,τι διάλεξε ο επισκέπτης μένει

function actsInScope(){

}
function renderFilter(){
  var box = document.getElementById('actFilter');

  var list = allActs();
  var count = function(sc){
    return list.filter(function(a){ return sc === 'all' || scopeOf(a) === sc; }).length;
  };
  /* το φίλτρο εμφανίζεται μόνο όταν υπάρχουν αναρτήσεις και από τα δύο έργα */

    box.innerHTML = ''; box.hidden = true;
    if (!actScopeUser) actScope = 'all';

           (actScope === sc ? 'true' : 'false') + '">' + esc(label) +
           '<b>' + count(sc) + '</b></button>';
  };
  var html = '';
  cats.forEach(function(c, i){
    if (cats.findIndex(function(x){ return x.scope === c.scope; }) === i) html += btn(c.scope, T(c.label));
  });
  html += btn('all', S('f_all'));

      announce(T(STRINGS.h_acts));
    });
  });
}
