/* καθαρισμός του HTML που έρχεται από το WordPress:
   κρατάμε μόνο ασφαλείς ετικέτες, πετάμε classes, ξένες εικόνες και social junk */
/* το WordPress βάζει στο κείμενο σμικρυμένες εκδοχές (π.χ. foto-300x239.jpg).
   Παίρνουμε τη μεγαλύτερη από το srcset, αλλιώς κόβουμε την κατάληξη -ΠΛΑΤΟΣxΥΨΟΣ. */
function biggestSrc(src, srcset){
  var best = '', bestW = 0;
  (srcset || '').split(',').forEach(function(part){
    var bits = part.trim().split(/\s+/);
    var w = parseInt((bits[1] || '').replace('w', ''), 10);
    if (bits[0] && w > bestW){ bestW = w; best = bits[0]; }
  });
  if (best && bestW >= 900) return best;
  var full = src.replace(/-\d{2,4}x\d{2,4}(\.(jpe?g|png|webp|gif))$/i, '$1');
  return full !== src ? full : (best || src);
}

var ALLOWED = {P:1,BR:1,STRONG:1,B:1,EM:1,I:1,U:1,UL:1,OL:1,LI:1,BLOCKQUOTE:1,
               H2:1,H3:1,H4:1,A:1,IMG:1,IFRAME:1,FIGURE:1,FIGCAPTION:1,DIV:1};
function stripHtml(html){
  var d = document.createElement('div');
  d.innerHTML = html;
  return (d.textContent || '').replace(/\s+/g, ' ').trim();
}
function cleanContent(html, site, title){
  var body = new DOMParser().parseFromString(html, 'text/html').body;
  var list = function(sel){ return Array.prototype.slice.call(body.querySelectorAll(sel)); };
  var unwrap = function(n){
    var kids = Array.prototype.slice.call(n.childNodes);
    var par = n.parentNode; if (!par) return;
    kids.forEach(function(k){ par.insertBefore(k, n); });
    par.removeChild(n);
  };

  list('script,style,link,form,input,button,noscript,svg,iframe:not([src])').forEach(function(n){ n.remove(); });
  list('span').forEach(unwrap);
  list('a').forEach(function(a){
    if (/facebook\.com|instagram\.com|twitter\.com|x\.com/i.test(a.getAttribute('href') || '')) unwrap(a);
  });

  list('*').forEach(function(node){
    if (!node.parentNode) return;
    var tag = node.tagName;
    if (!ALLOWED[tag]) { unwrap(node); return; }

    var keep = {};
    if (tag === 'A')      keep.href = node.getAttribute('href');
    var srcset = '';
    if (tag === 'IMG')  { keep.src = node.getAttribute('src'); keep.alt = node.getAttribute('alt') || '';
                          srcset = node.getAttribute('srcset') || ''; }
    if (tag === 'IFRAME') keep.src = node.getAttribute('src');
    Array.prototype.slice.call(node.attributes).forEach(function(at){ node.removeAttribute(at.name); });
    Object.keys(keep).forEach(function(k){ if (keep[k]) node.setAttribute(k, keep[k]); });

    if (tag === 'A'){ node.setAttribute('target', '_blank'); node.setAttribute('rel', 'noopener'); }
    if (tag === 'IMG'){
      var src = node.getAttribute('src') || '';
      if (src.indexOf(site) !== 0) { node.remove(); return; }
      if (!node.getAttribute('alt') && title) node.setAttribute('alt', title);
      node.setAttribute('src', biggestSrc(src, srcset));
      if (src !== node.getAttribute('src')) node.setAttribute('data-fallback', src);
      node.setAttribute('loading', 'lazy');
    }
    if (tag === 'IFRAME'){
      var v = node.getAttribute('src') || '';
      if (!/^https:\/\/(www\.youtube\.com\/embed\/|player\.vimeo\.com\/)/.test(v)) { node.remove(); return; }
      node.setAttribute('allowfullscreen', '');
      node.setAttribute('loading', 'lazy');
      var wrap = document.createElement('div');
      wrap.className = 'vid';
      node.parentNode.insertBefore(wrap, node);
      wrap.appendChild(node);
    }
  });

  /* κόψε γυμνά links προς βίντεο που ήδη παίζει ενσωματωμένο */
  var embedded = list('.vid iframe').map(function(f){
    var m = (f.getAttribute('src') || '').match(/embed\/([\w-]+)|video\/(\d+)/);
    return m ? (m[1] || m[2]) : '';
  }).filter(Boolean);
  list('a').forEach(function(a){
    var h = a.getAttribute('href') || '';
    var bare = stripHtml(a.innerHTML) === h;
    if (bare && embedded.some(function(id){ return h.indexOf(id) > -1; })) a.remove();
  });

  list('p,div,figure').reverse().forEach(function(n){
    if (!n.querySelector('img,iframe') && !stripHtml(n.innerHTML)) n.remove();
  });
  return body.innerHTML;
}

/* περίληψη κάρτας: χωρίς γυμνά links, με fallback στο σώμα της ανάρτησης */
function tidyExcerpt(excerptHtml, contentHtml){
  var clean = function(h){
    return stripHtml(h).replace(/https?:\/\/\S+/g, '').replace(/\s+/g, ' ').trim();
  };
  var t = clean(excerptHtml);
  if (t.length < 30){
    t = clean(contentHtml);
    if (t.length > 190) t = t.slice(0, 190).replace(/\s\S*$/, '') + '…';
  }
  if (!t) t = (lang === 'el' ? 'Δείτε την ανάρτηση.' : 'Open the post.');
  return t;
}

var CAT_SLUGS = { 'drasis-mathiton':'drasi', 'giortes-ekdilosis-2':'drasi', 'ergasies':'drasi',
                  'athlitismos':'drasi', 'ekdromes-episkepsis':'taxidi' };
/* διάλεξε αρχείο εικόνας αρκετά μεγάλο για το μέγεθος που θα εμφανιστεί,
   αλλιώς οι φωτογραφίες βγαίνουν θολές */
function pickSize(m, minWidth){
  if (!m) return '';
  var sizes = (m.media_details && m.media_details.sizes) || {};
  var cand = [];
  Object.keys(sizes).forEach(function(k){
    var z = sizes[k];
    if (z && z.source_url && z.width) cand.push(z);
  });
  cand.sort(function(a, b){ return a.width - b.width; });
  for (var i = 0; i < cand.length; i++){
    if (cand[i].width >= minWidth) return cand[i].source_url;
  }
  return m.source_url || (cand.length ? cand[cand.length - 1].source_url : '');
}

/* ---------- αγγλικά για τις αναρτήσεις: χειροκίνητα, [EN] ή αυτόματα ---------- */
function slugOf(link){
  var bits = String(link || '').replace(/[?#].*$/, '').replace(/\/+$/, '').split('/');
  return bits[bits.length - 1] || '';
}
/* Χωρίζει μια ανάρτηση σε ελληνικό και αγγλικό μέρος.
   Το σημάδι [EN] μπορεί να βρίσκεται οπουδήποτε μέσα στο κείμενο —
   και μέσα σε <div> ή <span> που βάζει το WordPress όταν γίνεται
   επικόλληση από αλλού. Ο αγγλικός τίτλος είναι η ίδια η γραμμή [EN],
   αγγλικό κείμενο είναι ό,τι ακολουθεί, ελληνικό ό,τι προηγείται.     */
function splitEN(html){
  var mark = null, root = new DOMParser().parseFromString(html, 'text/html').body;
  var all = Array.prototype.slice.call(root.querySelectorAll('*'));
  for (var i = 0; i < all.length; i++){
    if (/^\s*\[EN\]/i.test(all[i].textContent || '')){ mark = all[i]; break; }
  }
  if (!mark) return { el: html, en: '', title: '' };
  for (var deeper = true; deeper; ){            // κατεβαίνουμε στο πιο εσωτερικό στοιχείο
    deeper = false;
    for (var k = 0; k < mark.children.length; k++){
      if (/^\s*\[EN\]/i.test(mark.children[k].textContent || '')){
        mark = mark.children[k]; deeper = true; break;
      }
    }
  }
  var title = (mark.textContent || '').replace(/^\s*\[EN\]\s*/i, '').split('\n')[0].trim();
  mark.setAttribute('data-en-mark', '1');
  var serial = root.innerHTML;
  var cut = function(after){
    var b = new DOMParser().parseFromString(serial, 'text/html').body;
    var n = b.querySelector('[data-en-mark]');
    if (!n) return '';
    var node = n;
    while (n && n.parentNode){
      var s;
      while ((s = after ? n.nextSibling : n.previousSibling)) s.parentNode.removeChild(s);
      if (n.parentNode === b) break;
      n = n.parentNode;
    }
    if (node.parentNode) node.parentNode.removeChild(node);
    /* καθαρίζουμε τα άδεια κουτιά που μένουν πίσω */
    Array.prototype.slice.call(b.querySelectorAll('div, span, p')).reverse().forEach(function(x){
      if (!(x.textContent || '').trim() && !x.querySelector('img, iframe, video, br')){
        if (x.parentNode) x.parentNode.removeChild(x);
      }
    });
    return b.innerHTML.trim();
  };
  var el = cut(true), en = cut(false);
  return { el: el || html, en: en, title: title };
}

/* ── Μηχανή μετάφρασης ───────────────────────────────────────────────
   Οι έτοιμες μεταφράσεις φυλάσσονται στον browser του επισκέπτη, ώστε
   να μη ζητιούνται ξανά σε κάθε επίσκεψη (η δωρεάν υπηρεσία έχει όριο).
   Πρώτα μεταφράζονται ΟΛΟΙ οι τίτλοι, που είναι μικροί, και μετά οι
   περιλήψεις — έτσι οι τίτλοι βγαίνουν αγγλικοί ακόμη κι αν το όριο
   εξαντληθεί στη μέση.                                                */
var MT_STORE = 'dfta-mt-1';
var MT_CACHE = (function(){
  try { return JSON.parse(localStorage.getItem(MT_STORE) || '{}') || {}; }
  catch (e){ return {}; }
})();
var mtRunning = false, mtFails = 0, mtDead = false, mtSaveT = 0;
function mtSave(){
  clearTimeout(mtSaveT);
  mtSaveT = setTimeout(function(){
    try {
      var keys = Object.keys(MT_CACHE);
      if (keys.length > 400){
        keys.slice(0, keys.length - 400).forEach(function(k){ delete MT_CACHE[k]; });
      }
      localStorage.setItem(MT_STORE, JSON.stringify(MT_CACHE));
    } catch (e){}
  }, 800);
}
function mtWait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function mtChunks(text){
  var out = [], s = String(text || '').trim();
  while (s.length > 350){
    var cut = s.lastIndexOf('. ', 350);
    if (cut < 120) cut = s.lastIndexOf(' ', 350);
    if (cut < 120) cut = 350;
    out.push(s.slice(0, cut + 1)); s = s.slice(cut + 1);
  }
  if (s) out.push(s);
  return out;
}
function mtFetch(part){
  var url = 'https://api.mymemory.translated.net/get?langpair=el%7Cen&q=' +
            encodeURIComponent(part) +
            (TRANSLATE.email ? '&de=' + encodeURIComponent(TRANSLATE.email) : '');
  return fetch(url)
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(j){
      var out = (j && j.responseData && j.responseData.translatedText) || '';
      var st  = j && j.responseStatus;
      if (/MYMEMORY WARNING|QUOTA|INVALID|EXCEEDED/i.test(out)) out = '';
      if (st && String(st) !== '200') out = '';
      if (!out) throw new Error('empty');
      return out;
    });
}
function mtOne(text){
  var key = String(text || '').trim();
  if (!key || TRANSLATE.mode === 'off' || mtDead) return Promise.resolve('');
  if (MT_CACHE[key]) return Promise.resolve(MT_CACHE[key]);
  var job;
  if (TRANSLATE.mode === 'proxy' && TRANSLATE.endpoint){
    job = fetch(TRANSLATE.endpoint, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ q: key, source: 'el', target: 'en' })
    }).then(function(r){ return r.json(); })
      .then(function(j){ return j.t || j.translation || j.text || ''; });
  } else {
    job = mtChunks(key).reduce(function(chain, part){
      return chain.then(function(acc){
        if (acc === null) return null;                    // κάτι απέτυχε — σταματάμε εδώ
        return mtFetch(part)
          .catch(function(){                              // μία δεύτερη προσπάθεια
            return mtWait(1200).then(function(){ return mtFetch(part); });
          })
          .then(function(out){ return acc.concat(out); })
          .catch(function(){ return null; });
      });
    }, Promise.resolve([])).then(function(parts){
      return parts ? parts.join(' ').trim() : '';
    });
  }
  return job.then(function(out){
    if (out){ mtFails = 0; MT_CACHE[key] = out; mtSave(); }
    else if (++mtFails >= 5){ mtDead = true; }            // η υπηρεσία δεν απαντά· δεν επιμένουμε
    return out;
  }).catch(function(){ return ''; });
}
/* μεταφράζει τους τίτλους και τις περιλήψεις των καρτών, μία ανάρτηση τη φορά */
function ensureEnglish(){
  if (lang !== 'en' || TRANSLATE.mode === 'off' || mtRunning || mtDead) return;
  var todo = wpPosts.filter(function(p){ return p.needMT && !p.mtDone; });
  if (!todo.length) return;
  mtRunning = true;
  var redraw = function(){
    if (lang === 'en'){ renderActs(); renderLatest(); renderGallery(); }
  };
  var step = function(list, fn){
    return list.reduce(function(chain, post){
      return chain.then(function(){ return fn(post).then(function(){ return mtWait(180); }); });
    }, Promise.resolve());
  };
  step(todo, function(post){                              // 1. οι τίτλοι
    return mtOne(post.title.el).then(function(t){
      if (t){ post.title.en = t; post.mt = true; }
    });
  })
  .then(function(){
    redraw();
    return step(todo, function(post){                     // 2. οι περιλήψεις
      return mtOne(post.text.el).then(function(x){
        if (x){ post.text.en = x; post.mt = true; }
        post.mtDone = (post.title.en !== post.title.el) && !!x;
      });
    });
  })
  .then(function(){ mtRunning = false; redraw(); });
}
/* μεταφράζει το πλήρες κείμενο μιας ανάρτησης όταν ανοίγει στα αγγλικά */
function translateReader(box, post){
  /* παίρνουμε μόνο τα «φύλλα» του κειμένου, ώστε να μη μεταφράσουμε
     δύο φορές το ίδιο (το WordPress βάζει και <div> αντί για <p>) */
  var nodes = Array.prototype.slice.call(
    box.querySelectorAll('p, li, h2, h3, h4, blockquote, figcaption, div')
  ).filter(function(n){
    if ((n.textContent || '').trim().length <= 2) return false;
    return !Array.prototype.some.call(n.children, function(k){
      return (k.textContent || '').trim().length > 2;
    });
  });
  var dropWait = function(){
    var w = box.querySelector('.mt-wait');
    if (w) w.remove();
  };
  if (!nodes.length){ dropWait(); return; }
  nodes.reduce(function(chain, n){
    return chain.then(function(){
      return mtOne(n.textContent.trim()).then(function(out){
        if (out) n.textContent = out;
      });
    });
  }, Promise.resolve()).then(function(){
    dropWait();
    post.htmlEnAuto = box.innerHTML;          // αποθηκεύεται για να μη ξαναμεταφραστεί
    if (TRANSLATE.badge){
      var tag = document.createElement('span');
      tag.className = 'mt-tag';
      tag.textContent = S('mt_tag');
      box.insertBefore(tag, box.firstChild);
    }
  });
}

/* σε ποιο έργο ανήκει μια ανάρτηση, με βάση τις κατηγορίες του WordPress */
function postProject(ids){
  var cats = WP_FEED.cats || [], hit = null;
  (ids || []).forEach(function(id){
    cats.forEach(function(c){
      if (c.id !== id) return;
      if (!hit || (c.scope === 'new' && hit.scope !== 'new')) hit = c;   // το νέο υπερισχύει
    });
  });
  return hit || cats[0] || null;
}
function loadFeed(){
  if (!WP_FEED.enabled) return;
  var ids = (WP_FEED.cats || []).map(function(c){ return c.id; }).join(',');
  var url = WP_FEED.site + '/wp-json/wp/v2/posts?categories=' + ids +
            '&per_page=' + WP_FEED.count + '&_embed=wp:featuredmedia,wp:term';
  fetch(url)
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(list){
      wpPosts = list.map(function(post){
        var media = post._embedded && post._embedded['wp:featuredmedia'] && post._embedded['wp:featuredmedia'][0];
        var terms = (post._embedded && post._embedded['wp:term'] && post._embedded['wp:term'][0]) || [];
        var cat = 'nea';
        terms.forEach(function(t){ if (CAT_SLUGS[t.slug]) cat = CAT_SLUGS[t.slug]; });
        var title = stripHtml(post.title.rendered);
        var bi    = splitEN(post.content.rendered);
        var man   = EN_POSTS[slugOf(post.link)] || {};
        var text  = tidyExcerpt(post.excerpt.rendered, bi.el);
        var titleEn = man.title || bi.title || '';
        var textEn  = man.text  || (bi.en ? tidyExcerpt('', bi.en) : '');
        var proj = postProject(post.categories);
        return {
          date: post.date.slice(0, 10),
          cat: cat,
          proj: proj,
          scope: proj ? proj.scope : 'new',
          img: pickSize(media, 900),
          imgBig: pickSize(media, 1700),
          link: post.link,
          fromWp: true,
          title: { el: title, en: titleEn || title },
          text:  { el: text,  en: textEn  || text  },
          html:   cleanContent(bi.el, WP_FEED.site, title),
          htmlEn: bi.en ? cleanContent(bi.en, WP_FEED.site, titleEn || title) : '',
          needMT: !titleEn,          // δεν υπάρχει δικό σας αγγλικό κείμενο
          photos: []
        };
      });
      wpPosts.forEach(function(post){
        var box = document.createElement('div');
        box.innerHTML = post.html;
        var seen = {};
        if (post.imgBig){ post.photos.push(post.imgBig); seen[post.imgBig] = 1; }
        Array.prototype.slice.call(box.querySelectorAll('img')).forEach(function(im){
          var src = im.getAttribute('src');
          if (src && !seen[src]){ seen[src] = 1; post.photos.push(src); }
        });
      });
      document.getElementById('feedNote').hidden = true;
      feedLoading = false;
      ensureEnglish();
      renderFilter();
      renderActs();
      renderGallery();
      renderLatest();
      setupObserver();
    })
    .catch(function(err){
      feedLoading = false;
      renderActs();
      if (location.protocol === 'file:'){
        var n = document.getElementById('feedNote');
        n.hidden = false;
        n.textContent = lang === 'el'
          ? 'Σημείωση για τον διαχειριστή: οι αναρτήσεις από το site του σχολείου εμφανίζονται μόνο όταν η σελίδα είναι ανεβασμένη στο διαδίκτυο. Τοπικά βλέπετε μόνο τις χειροκίνητες δράσεις.'
          : 'Admin note: posts from the school site load only when this page is online. Locally you only see the manually listed activities.';
      } else {
        console.warn('Δεν φορτώθηκαν οι αναρτήσεις:', err);
      }
    });
}

/* ---------- ζωντανή ποιότητα αέρα στους τρεις προορισμούς ---------- */
var AIR_PLACES = [

function loadAir(){
  var lats = AIR_PLACES.map(function(p){ return p.lat; }).join(',');
  var lons = AIR_PLACES.map(function(p){ return p.lon; }).join(',');
  var url = 'https://air-quality-api.open-meteo.com/v1/air-quality?latitude=' + lats +
            '&longitude=' + lons + '&current=european_aqi,pm2_5&timezone=auto';
  renderAir();
  fetch(url)
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(j){
      var arr = Array.isArray(j) ? j : [j];
      airData = arr.map(function(x){
        return { aqi: (x.current && x.current.european_aqi) || 0,
                 pm:  (x.current && x.current.pm2_5) || 0 };
      });
      if (airData.some(function(d){ return !d.aqi; })) throw new Error('κενά δεδομένα');
      renderAir();
      setupObserver();
    })
    .catch(function(){
      airData = null;
      /* χωρίς δεδομένα αέρα, η ενότητα κρατά μόνο το αποτύπωμα της σελίδας */
      var sec = document.getElementById('planet');

      }
    });
}

function renderFootprint(){
  var box = document.getElementById('footprint');
  if (!box) return;
  var total = 0;
  try {
    var navEntry = performance.getEntriesByType('navigation')[0];
    if (navEntry && navEntry.transferSize) total += navEntry.transferSize;
    performance.getEntriesByType('resource').forEach(function(r){ total += r.transferSize || 0; });
  } catch (e) { total = 0; }
  if (!total){ box.innerHTML = ''; return; }

  var mb = total / (1024 * 1024);
  var grams = mb * 0.5;                 // ~0,5 g CO₂ ανά MB που μεταφέρεται
  var lighter = Math.max(0, Math.round((1 - mb / 2.5) * 100));

/* δεντράκι-δείκτης: όσο ελαφρύτερη η σελίδα, τόσα περισσότερα φύλλα ανοίγουν */
function treeSVG(score){
  var N = 34, on = Math.max(5, Math.round(N * Math.min(100, score) / 100));
  var seed = 20260910, rnd = function(){ seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  var greens = ['#63d99e', '#2fae6f', '#8fdcb6', '#4cc98a'];
  /* τρεις λοβοί δίνουν στη φυλλωσιά σχήμα δέντρου αντί για τυχαίο σύννεφο */
  var lobes = [[48, 78, 21], [92, 76, 21], [70, 48, 25]], pts = [], i;
  for (i = 0; i < N; i++){
    var L = lobes[i % 3], a = rnd() * 6.2832, r = Math.sqrt(rnd());
    pts.push([L[0] + Math.cos(a) * r * L[2], L[1] + Math.sin(a) * r * L[2] * 0.92,
              6.5 + rnd() * 4.5, greens[i % 4]]);
  }
  pts.sort(function(p, q){ return q[1] - p[1]; });           // φυτρώνει από κάτω προς τα πάνω
  var svg = '<svg width="150" height="180" viewBox="0 0 140 180" aria-hidden="true" focusable="false">' +
    '<ellipse cx="70" cy="170" rx="34" ry="4.5" fill="rgba(99,217,158,.22)"/>' +
    '<path d="M70,170 C68,142 66,128 70,106" stroke="#a9825a" stroke-width="6.5" fill="none" stroke-linecap="round"/>' +
    '<path d="M70,132 C62,126 56,120 50,112" stroke="#a9825a" stroke-width="3.4" fill="none" stroke-linecap="round"/>' +
    '<path d="M70,124 C78,118 84,113 90,106" stroke="#a9825a" stroke-width="3.2" fill="none" stroke-linecap="round"/>';
  for (i = 0; i < on; i++){
    svg += '<circle class="lf" cx="' + pts[i][0].toFixed(1) + '" cy="' + pts[i][1].toFixed(1) +
           '" r="' + pts[i][2].toFixed(1) + '" fill="' + pts[i][3] + '" opacity=".85" ' +
           'style="animation-delay:' + (0.25 + i * 0.045).toFixed(2) + 's"/>';
  }
  return svg + '</svg>';
}

var lastFocus = null;
function focusables(box){
  return Array.prototype.slice.call(box.querySelectorAll(
    'a[href],button:not([disabled]),input,select,textarea,[tabindex]:not([tabindex="-1"])'
  )).filter(function(n){ return n.offsetParent !== null || n === document.activeElement; });
}
function trapFocus(box, e){
  var f = focusables(box);
  if (!f.length) return;
  var first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
}
function restoreFocus(){
  if (lastFocus && lastFocus.focus) { try { lastFocus.focus(); } catch(e){} }
  lastFocus = null;

  mode: 'sway',    // 'sway' = ταλαντώνεται γύρω από την Ευρώπη (οι προορισμοί
                   //          μένουν πάντα ορατοί)
                   // 'spin' = συνεχής πλήρης περιστροφή
  center: 15,      // κεντρικό γεωγραφικό μήκος (15 = καρδιά της Ευρώπης)
  sway: 27,        // πόσες μοίρες αριστερά-δεξιά στη λειτουργία 'sway'
  period: 36,      // δευτερόλεπτα για μία πλήρη ταλάντωση
  turn: 78,        // δευτερόλεπτα ανά περιστροφή στη λειτουργία 'spin'
  tilt: 15         // κλίση του άξονα σε μοίρες
};

function ll(lat, lon){
  var a = lat * Math.PI / 180, b = lon * Math.PI / 180;
  return [Math.cos(a) * Math.cos(b), Math.sin(a), -Math.cos(a) * Math.sin(b)];
}
/* Λαύριο και οι προορισμοί του σχεδίου.
   Κάθε χώρα -- και η διαδρομή προς αυτήν -- έχει το δικό της χρώμα.
   c = χρώμα πινέζας και διαδρομής, t = πιο σκούρα απόχρωση για το κείμενο. */
/* lab = πού κάθεται η ετικέτα σε σχέση με την πινέζα:
   side 'r' = δεξιά της, 'l' = αριστερά της· dy = πόσο πιο πάνω/κάτω. */
var CITIES = [
  { v: ll(37.71,  24.06), c: '#2a63ff', t: '#1b4bd8', home: true, lab: { side: 'r', dy:   4 }, name: { el: 'Λαύριο',     en: 'Lavrio'   } },
  { v: ll(55.25,   9.49), c: '#e04b3f', t: '#c0271d',             lab: { side: 'l', dy: -16 }, name: { el: 'Δανία',      en: 'Denmark'  } },
  { v: ll(37.99,  -1.13), c: '#c47100', t: '#8f5600',             lab: { side: 'l', dy: -14 }, name: { el: 'Ισπανία',    en: 'Spain'    } },
  { v: ll(52.52,  13.40), c: '#8b5cf6', t: '#6d3fe0',             lab: { side: 'r', dy:  -8 }, name: { el: 'Γερμανία',   en: 'Germany'  } },
  { v: ll(38.72,  -9.14), c: '#0f9463', t: '#0b7d52',             lab: { side: 'l', dy:  18 }, name: { el: 'Πορτογαλία', en: 'Portugal' } }
];
var ARCS = [
  { from: 0, to: 1, c: '#e04b3f', dur: 5.5, delay: 0   },
  { from: 0, to: 2, c: '#c47100', dur: 6.4, delay: 1.6 },
  { from: 0, to: 3, c: '#8b5cf6', dur: 5.9, delay: 3.2 },
  { from: 0, to: 4, c: '#0f9463', dur: 6.8, delay: 4.6 }
];

/* κατεύθυνση του ήλιου αυτή τη στιγμή — υπολογισμένη από την ώρα και την ημερομηνία */
function sunVector(date){
  var d = date || new Date();
  var start = Date.UTC(d.getUTCFullYear(), 0, 1);
  var day = (Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) - start) / 86400000 + 1;
  var decl = 23.44 * Math.sin(2 * Math.PI * (day - 81) / 365.24);          // απόκλιση
  var hours = d.getUTCHours() + d.getUTCMinutes() / 60;
  var lonSun = -15 * (hours - 12);                                          // υπoηλιακό μήκος
  return ll(decl, lonSun);
}

/* φύλλα σε τροχιά γύρω από τον πλανήτη.
   inc = κλίση τροχιάς σε μοίρες, phase = από πού ξεκινά, speed = δευτερόλεπτα
   για έναν γύρο, r = απόσταση από το κέντρο, size = μέγεθος, c = χρώμα.
   Προσθέστε ή αφαιρέστε γραμμές ελεύθερα. */
var LEAVES = [
  { inc:  28, phase: 0.0, speed: 22, r: 1.22, size: 14, c: '#2fae6f' },
  { inc: -34, phase: 2.1, speed: 27, r: 1.28, size: 12, c: '#63d99e' },
  { inc:  62, phase: 4.0, speed: 33, r: 1.18, size: 11, c: '#2fae6f' },
  { inc:  12, phase: 1.2, speed: 25, r: 1.33, size:  9, c: '#8fdcb6' },
  { inc: -58, phase: 3.4, speed: 30, r: 1.25, size: 13, c: '#1f8f5b' },
  { inc:  44, phase: 5.3, speed: 38, r: 1.15, size:  8, c: '#63d99e' },
  { inc: -18, phase: 0.8, speed: 35, r: 1.31, size: 10, c: '#2fae6f' },
  { inc:  76, phase: 2.7, speed: 29, r: 1.20, size:  9, c: '#a7e6c8' },
  { inc: -70, phase: 5.9, speed: 24, r: 1.27, size: 11, c: '#4cc98a' },
  { inc:  34, phase: 3.9, speed: 41, r: 1.36, size:  8, c: '#8fdcb6' }
];
/* ρεύματα αέρα (αεροχείμαρροι) που κυλούν γύρω από τον πλανήτη.
   lat = γεωγραφικό πλάτος, speed = δευτερόλεπτα για έναν γύρο, a = ένταση */
var WINDS = [
  { lat:  52, speed:  58, w: 1.2, a: 0.30 },
  { lat:  30, speed:  74, w: 1.4, a: 0.26 },
  { lat:   6, speed:  96, w: 1.1, a: 0.20 },
  { lat: -24, speed:  82, w: 1.2, a: 0.22 }
];

/* σπόροι πικραλίδας που παρασύρονται μπροστά από την υδρόγειο.
   x0/y0 = αφετηρία (0-1 του πλάτους/ύψους), sp = ταχύτητα, wob = πόσο λικνίζονται */
var SEEDS = [
  { x0: 0.05, y0: 0.24, sp: 0.020, wob: 0.030, ph: 0.0, size: 7.5 },
  { x0: 0.34, y0: 0.62, sp: 0.014, wob: 0.042, ph: 1.7, size: 6.0 },
  { x0: 0.61, y0: 0.41, sp: 0.024, wob: 0.026, ph: 3.1, size: 5.2 },
  { x0: 0.82, y0: 0.78, sp: 0.017, wob: 0.036, ph: 4.6, size: 6.8 },
  { x0: 0.19, y0: 0.88, sp: 0.012, wob: 0.024, ph: 2.4, size: 5.6 }
];
function drawSeed(ctx, x, y, size, tilt, alpha){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(tilt);
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = 'rgba(126,158,220,.85)';
  ctx.lineWidth = 0.9;
  ctx.beginPath();
  ctx.moveTo(0, size * 0.25); ctx.lineTo(0, size);                                   // μίσχος
  for (var i = 0; i < 9; i++){                                                       // πούπουλο
    var a = -Math.PI / 2 + (i - 4) * 0.30;
    ctx.moveTo(0, size * 0.25);
    ctx.lineTo(Math.cos(a) * size * 0.95, size * 0.25 + Math.sin(a) * size * 0.95);
  }
  ctx.stroke();
  ctx.globalAlpha = alpha * 0.9;
  ctx.fillStyle = '#6f88bd';
  ctx.beginPath(); ctx.arc(0, size * 1.02, 1.5, 0, 6.2832); ctx.fill();              // σπόρος
  ctx.restore();
  ctx.globalAlpha = 1;
}

function leafAt(leaf, sec){
  var th = leaf.phase + sec * 2 * Math.PI / leaf.speed;
  var i = leaf.inc * Math.PI / 180;
  var x = Math.cos(th), z = Math.sin(th);
  return [x * leaf.r, -z * Math.sin(i) * leaf.r, z * Math.cos(i) * leaf.r];
}
function drawLeaf(ctx, x, y, size, rot, color, alpha){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, -size);
  ctx.quadraticCurveTo(size * 0.85, -size * 0.15, 0, size);
  ctx.quadraticCurveTo(-size * 0.85, -size * 0.15, 0, -size);
  ctx.fill();
  ctx.globalAlpha = alpha * 0.55;
  ctx.strokeStyle = 'rgba(255,255,255,.75)';
  ctx.lineWidth = Math.max(0.8, size * 0.10);
  ctx.beginPath(); ctx.moveTo(0, -size * 0.75); ctx.lineTo(0, size * 0.75); ctx.stroke();
  ctx.restore();
  ctx.globalAlpha = 1;
}

function slerp(a, b, t){
  var d = Math.max(-1, Math.min(1, a[0]*b[0] + a[1]*b[1] + a[2]*b[2]));
  var om = Math.acos(d), so = Math.sin(om);
  if (so < 1e-6) return a.slice();
  var s1 = Math.sin((1 - t) * om) / so, s2 = Math.sin(t * om) / so;
  return [a[0]*s1 + b[0]*s2, a[1]*s1 + b[1]*s2, a[2]*s1 + b[2]*s2];
}
function lift(v, k){ return [v[0]*k, v[1]*k, v[2]*k]; }

function startGlobe(){
  var cv = document.getElementById('globe');
  if (!cv || !cv.getContext) return;
  var ctx = cv.getContext('2d');
  var slow = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* αποσυμπίεση των σημείων ξηράς */
  var N = 14000, PHI = Math.PI * (3 - Math.sqrt(5)), bin = atob(LAND), land = [];
  for (var i = 0; i < N; i++){
    if (!(bin.charCodeAt(i >> 3) & (1 << (i & 7)))) continue;
    var y = 1 - (i / (N - 1)) * 2;
    var rr = Math.sqrt(Math.max(0, 1 - y * y));
    var th = PHI * i;
    land.push([Math.cos(th) * rr, y, -Math.sin(th) * rr]);
  }

  var W = 0, H = 0, cx = 0, cy = 0, R = 0, dpr = 1;
  function resize(){
    var box = cv.getBoundingClientRect();
    if (!box.width) return false;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = box.width; H = box.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = W * 0.50; cy = H * 0.50; R = Math.min(W, H) * 0.46;
    return true;
  }

  var tiltR = GLOBE.tilt * Math.PI / 180;
  function proj(v, ang){
    var ca = Math.cos(ang), sa = Math.sin(ang);
    var x = v[0]*ca + v[2]*sa;
    var z = -v[0]*sa + v[2]*ca;
    var ct = Math.cos(tiltR), st = Math.sin(tiltR);
    var y2 = v[1]*ct - z*st;
    var z2 = v[1]*st + z*ct;
    return [cx + x*R, cy - y2*R, z2];
  }

  var LBL_FONT = '700 13px Commissioner, system-ui, sans-serif';

  function roundRect(c, x, y, w, h, r){
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y,     x + w, y + h, r);
    c.arcTo(x + w, y + h, x,     y + h, r);
    c.arcTo(x,     y + h, x,     y,     r);
    c.arcTo(x,     y,     x + w, y,     r);
    c.closePath();
  }

  function draw(ang, t){
    ctx.clearRect(0, 0, W, H);

    /* απαλή ατμόσφαιρα */
    var g = ctx.createRadialGradient(cx, cy, R*0.55, cx, cy, R*1.25);
    g.addColorStop(0, 'rgba(42,99,255,.10)');
    g.addColorStop(1, 'rgba(42,99,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, R*1.25, 0, 6.2832); ctx.fill();

    /* δίσκος και περίγραμμα */
    ctx.fillStyle = 'rgba(42,99,255,.045)';
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = 'rgba(42,99,255,.18)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.2832); ctx.stroke();

    /* φύλλα που περνούν πίσω από τον πλανήτη */
    var secs = t / 1000;
    LEAVES.forEach(function(lf){
      var v = leafAt(lf, secs), q = proj(v, 0);
      if (q[2] >= 0) return;
      drawLeaf(ctx, q[0], q[1], lf.size * 0.8, secs * 0.6 + lf.phase, lf.c, 0.16);
    });

    /* ξηρά: μία προβολή, πρώτα η πίσω πλευρά και μετά η μπροστινή,
       με φωτισμό από την πραγματική θέση του ήλιου */
    var k, p, fronts = [], lit = [];
    ctx.fillStyle = 'rgba(13,23,52,.05)';
    for (k = 0; k < land.length; k++){
      p = proj(land[k], ang);
      if (p[2] > 0){
        var v = land[k];
        fronts.push(p);
        lit.push(Math.max(0, v[0]*sun[0] + v[1]*sun[1] + v[2]*sun[2]));
        continue;
      }
      ctx.beginPath(); ctx.arc(p[0], p[1], 0.8, 0, 6.2832); ctx.fill();
    }
    for (k = 0; k < fronts.length; k++){
      p = fronts[k];
      var day = 0.48 + 0.52 * Math.min(1, lit[k] * 2.1);   // μέρα / νύχτα
      ctx.fillStyle = 'rgba(30,74,190,' + ((0.13 + 0.40 * p[2]) * day).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(p[0], p[1], (0.8 + 1.2 * p[2]) * (0.82 + 0.18 * day), 0, 6.2832); ctx.fill();
    }

    /* απαλή λάμψη εκεί που πέφτει κάθετα ο ήλιος */
    var sp = proj(sun, ang);
    if (sp[2] > 0){
      var sg = ctx.createRadialGradient(sp[0], sp[1], 0, sp[0], sp[1], R * 0.62);
      sg.addColorStop(0, 'rgba(255,232,150,' + (0.46 * sp[2]).toFixed(3) + ')');
      sg.addColorStop(1, 'rgba(255,236,170,0)');
      ctx.save();
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.2832); ctx.clip();
      ctx.fillStyle = sg;
      ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
      ctx.restore();
    }

    /* ρεύματα αέρα: λεπτοί αεροχείμαρροι που κυλούν γύρω από τον πλανήτη */
    WINDS.forEach(function(wd){
      var latR = wd.lat * Math.PI / 180, cl = Math.cos(latR), sl = Math.sin(latR);
      var drift = (slow ? 0 : secs) * 2 * Math.PI / wd.speed, open = false;
      ctx.lineWidth = wd.w;
      ctx.strokeStyle = '#7e9edc';
      ctx.setLineDash([2.5, 9]);
      ctx.lineDashOffset = (slow ? 0 : -secs * 11);
      ctx.globalAlpha = wd.a;
      ctx.beginPath();
      for (var i = 0; i <= 96; i++){
        var lon = i / 96 * 6.2832 + drift;
        var q = proj([cl * Math.cos(lon) * 1.03, sl * 1.03, -cl * Math.sin(lon) * 1.03], ang);
        if (q[2] > 0.06){                       // μόνο η μπροστινή πλευρά
          if (open) ctx.lineTo(q[0], q[1]);
          else { ctx.moveTo(q[0], q[1]); open = true; }
        } else open = false;
      }
      ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1;
    });

    /* τόξα διαδρομών */
    ARCS.forEach(function(arc){
      var A = CITIES[arc.from].v, B = CITIES[arc.to].v, steps = 56, prev = null;
      ctx.lineWidth = 1.8; ctx.lineCap = 'round';
      for (var i = 0; i <= steps; i++){
        var u = i / steps;
        var v = lift(slerp(A, B, u), 1 + 0.17 * Math.sin(Math.PI * u));
        var q = proj(v, ang);
        if (prev && (q[2] > -0.08 || prev[2] > -0.08)){
          var vis = Math.max(0, Math.min(1, (Math.min(q[2], prev[2]) + 0.1) / 0.4));
          if (vis > 0){
            ctx.strokeStyle = arc.c;
            ctx.globalAlpha = 0.22 + 0.55 * vis;
            ctx.beginPath(); ctx.moveTo(prev[0], prev[1]); ctx.lineTo(q[0], q[1]); ctx.stroke();
          }
        }
        prev = q;
      }
      ctx.globalAlpha = 1;

      /* φως που ταξιδεύει */
      var tt = ((t / 1000 + arc.delay) % arc.dur) / arc.dur;
      var vv = lift(slerp(A, B, tt), 1 + 0.17 * Math.sin(Math.PI * tt));
      var pp = proj(vv, ang);
      if (pp[2] > 0){
        ctx.fillStyle = arc.c;
        ctx.globalAlpha = 0.18;
        ctx.beginPath(); ctx.arc(pp[0], pp[1], 8, 0, 6.2832); ctx.fill();
        ctx.globalAlpha = 1;
        ctx.beginPath(); ctx.arc(pp[0], pp[1], 3.4, 0, 6.2832); ctx.fill();
      }
    });

    /* πινέζες με το όνομά τους δίπλα· όσες πέφτουν κοντά, κατεβαίνουν λίγο */
    var vis = [];
    CITIES.forEach(function(city){
      var q = proj(city.v, ang);
      if (q[2] > 0.02) vis.push({ city: city, x: q[0], y: q[1], z: q[2] });
    });

    vis.forEach(function(v){
      var fade = Math.min(1, v.z / 0.28), col = v.city.c;
      if (v.city.home){
        var pulse = 1 + 1.8 * (((t / 1000) % 2.4) / 2.4);
        ctx.globalAlpha = fade * (1 - ((t / 1000) % 2.4) / 2.4) * 0.5;
        ctx.strokeStyle = col; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.arc(v.x, v.y, 5.5 * pulse, 0, 6.2832); ctx.stroke();
      }
      ctx.globalAlpha = fade;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(v.x, v.y, 5.6, 0, 6.2832); ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.arc(v.x, v.y, 5.6, 0, 6.2832); ctx.stroke();
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(v.x, v.y, 2.1, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = 1;
    });

    /* ετικέτες: ταξιδεύουν μαζί με την πινέζα τους, η καθεμιά στη θέση
       που ορίζει το lab της χώρας ώστε να μην πέφτουν η μία πάνω στην άλλη */
    ctx.font = LBL_FONT;
    vis.forEach(function(v){
      var cfg = v.city.lab || { side: 'r', dy: 4 };
      var txt = T(v.city.name), h = 22, w = ctx.measureText(txt).width + 36;
      var x = cfg.side === 'l' ? v.x - 13 - w : v.x + 13;
      var y = v.y + (cfg.dy || 0) - h / 2;
      x = Math.max(3, Math.min(W - 3 - w, x));
      y = Math.max(3, Math.min(H - 3 - h, y));

      ctx.globalAlpha = 0.35 + 0.65 * Math.min(1, v.z / 0.28);
      ctx.fillStyle = 'rgba(255,255,255,.92)';
      ctx.strokeStyle = 'rgba(13,23,52,.10)'; ctx.lineWidth = 1;
      roundRect(ctx, x, y, w, h, 11);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = v.city.c;
      ctx.beginPath(); ctx.arc(x + 13, y + h / 2, 3.6, 0, 6.2832); ctx.fill();
      ctx.fillStyle = v.city.t || v.city.c;
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(txt, x + 23, y + h / 2 + 0.5);
      ctx.textBaseline = 'alphabetic';
      ctx.globalAlpha = 1;
    });

    /* φύλλα που περνούν μπροστά από τον πλανήτη */
    LEAVES.forEach(function(lf){
      var v = leafAt(lf, secs), q = proj(v, 0);
      if (q[2] < 0) return;
      var near = 0.55 + 0.45 * q[2];
      drawLeaf(ctx, q[0], q[1], lf.size * near, secs * 0.6 + lf.phase, lf.c, 0.55 + 0.4 * q[2]);
    });

    /* σπόροι πικραλίδας που περνούν μπροστά, παρασυρμένοι από τον άνεμο */
    SEEDS.forEach(function(sd){
      var u = (sd.x0 + (slow ? 0 : secs) * sd.sp) % 1.24 - 0.12;
      var x = u * W;
      var y = (sd.y0 + Math.sin(secs * 0.45 + sd.ph) * sd.wob) * H;
      var edge = Math.min(1, Math.min(x + 40, W - x + 40) / 90);
      if (edge <= 0) return;
      drawSeed(ctx, x, y, sd.size, Math.sin(secs * 0.7 + sd.ph) * 0.45, 0.5 * edge);
    });
  }

  var sun = sunVector();
  setInterval(function(){ sun = sunVector(); }, 60000);

  var RAD = Math.PI / 180;
  function angleAt(sec){
    if (slow) return (-90 - GLOBE.center) * RAD;
    if (GLOBE.mode === 'spin') return (-90 - GLOBE.center) * RAD + sec * (2 * Math.PI / GLOBE.turn);
    var lon = GLOBE.center + GLOBE.sway * Math.sin(sec * 2 * Math.PI / GLOBE.period);
    return (-90 - lon) * RAD;
  }
  /* αυτορρύθμιση: αν η συσκευή δυσκολεύεται (παλιό laptop, διαδραστικός πίνακας),
     λιγοστεύουν μόνα τους τα διακοσμητικά, ώστε η κίνηση να μείνει ομαλή */
  var fpsN = 0, fpsT0 = 0, tuned = false;
  function tune(now){
    if (tuned) return;
    if (!fpsT0){ fpsT0 = now; return; }
    fpsN++;
    if (now - fpsT0 < 2000) return;
    tuned = true;
    var fps = fpsN / ((now - fpsT0) / 1000);
    if (fps < 45){
      SEEDS.length = 0;
      LEAVES.splice(Math.max(3, Math.ceil(LEAVES.length / 2)));
    }
    if (fps < 30) WINDS.length = 0;
  }

  var start = null;
  function frame(now){
    if (!start) start = now;
    if (cv.offsetWidth && !document.hidden){
      if (W !== cv.getBoundingClientRect().width) resize();
      draw(angleAt((now - start) / 1000), now);
      tune(now);
    }
    requestAnimationFrame(frame);
  }
  if (resize()) requestAnimationFrame(frame);
  else setTimeout(function(){ if (resize()) requestAnimationFrame(frame); }, 300);
  window.addEventListener('resize', function(){ resize(); });
}

/* ---------- EU flag stars ---------- */
function renderEUStars(){
  var g = document.getElementById('euStars');
  var svgns = 'http://www.w3.org/2000/svg';

/* ---------- reveal + counters ---------- */
var io = null, booted = false;
function settle(node){
  /* μετά το reveal, το στοιχείο ξαναποκτά τα γρήγορα hover transitions */
  setTimeout(function(){
    node.classList.remove('rv');
    node.style.transitionDelay = '';
  }, 1900);
}
function reveal(node, counted, instant){
  node.classList.add('in');
  var cvs = node.querySelectorAll('.cv');
  for (var i=0;i<cvs.length;i++){
    if (counted.has(cvs[i])) continue;
    counted.add(cvs[i]);
    if (instant) cvs[i].textContent = cvs[i].getAttribute('data-cv');
    else countUp(cvs[i], +cvs[i].getAttribute('data-cv'));
  }
  settle(node);
}
function setupObserver(){
  if (io) io.disconnect();
  var counted = new WeakSet();
  io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if (!e.isIntersecting) return;
      reveal(e.target, counted, false);
      io.unobserve(e.target);
    });
  }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });
  var rvs = document.querySelectorAll('.rv');
  for (var i=0;i<rvs.length;i++){
    /* σε επανασχεδίαση (π.χ. αλλαγή γλώσσας) ό,τι είναι πάνω από το viewport εμφανίζεται αμέσως */
    rvs[i].setAttribute('data-rv', '1');
    if (booted && rvs[i].getBoundingClientRect().top < 0){
      reveal(rvs[i], counted, true);
    } else {
      io.observe(rvs[i]);
    }
  }
}

/* γραμμή χρονολογίου που γεμίζει με το scroll */
var tlBox = document.getElementById('tlList');
function tlProgress(){
  var r = tlBox.getBoundingClientRect();
  if (r.height === 0) return;
  var p = (window.innerHeight * 0.8 - r.top) / r.height;
  tlBox.style.setProperty('--tlp', Math.max(0, Math.min(1, p)).toFixed(3));
}
window.addEventListener('scroll', tlProgress, { passive: true });
window.addEventListener('resize', tlProgress, { passive: true });
function countUp(node, target){
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce){ node.textContent = target; return; }
  var t0 = null, dur = 1300;
  function step(ts){
    if (!t0) t0 = ts;
    var p = Math.min((ts - t0)/dur, 1);
    var eased = 1 - Math.pow(1 - p, 3);
    node.textContent = Math.round(target * eased);
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* wave: SVG path που «πλημμυρίζει» την οθόνη */
var w1 = curtain.querySelector('.w1'), w2 = curtain.querySelector('.w2');
function waveAnim(mode, dur, cb){
  var t0 = null;
  function frame(now){
    if (!t0) t0 = now;
    var t = Math.min((now - t0)/dur, 1);
    var e = t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2;
    var amp = Math.sin(Math.PI * e) * 14;
    var y = 112 - e*124;
    if (mode === 'cover'){
      var y2 = y - 6 - amp*0.25;
      w1.setAttribute('d','M0 '+y+' Q 50 '+(y-amp)+' 100 '+y+' L100 112 L0 112 Z');
      w2.setAttribute('d','M0 '+y2+' Q 50 '+(y2-amp*1.3)+' 100 '+y2+' L100 112 L0 112 Z');
    } else {
      var y3 = y + 6 + amp*0.25;
      w1.setAttribute('d','M0 '+y+' Q 50 '+(y-amp)+' 100 '+y+' L100 -12 L0 -12 Z');
      w2.setAttribute('d','M0 '+y3+' Q 50 '+(y3-amp*1.3)+' 100 '+y3+' L100 -12 L0 -12 Z');
    }
    if (t < 1) requestAnimationFrame(frame);
    else if (cb) cb();
  }
  requestAnimationFrame(frame);
}

/* mosaic: πλακίδια που ξεπηδούν ακτινωτά από το σημείο του κλικ */
var mosaicBox = curtain.querySelector('.c-mosaic');
function buildMosaic(){
  if (TRANSITION !== 'mosaic' || mosaicBox.children.length) return;
  var cols = 16;
  var rows = Math.max(6, Math.round(cols * window.innerHeight / window.innerWidth));
  mosaicBox.style.gridTemplateRows = 'repeat(' + rows + ',1fr)';
  for (var i=0; i<cols*rows; i++){
    var t = document.createElement('i');
    if (i % 9 === 3) t.className = 'blue';
    else if (i % 7 === 2) t.className = 'deep';
    var rnd = function(){ return ((Math.random() * 2 - 1) * 62).toFixed(0) + 'deg'; };
    t.style.setProperty('--rx', rnd());
    t.style.setProperty('--ry', rnd());
    t.style.setProperty('--rx2', rnd());
    t.style.setProperty('--ry2', rnd());
    mosaicBox.appendChild(t);
  }
  mosaicBox.dataset.cols = cols; mosaicBox.dataset.rows = rows;
}
function mosaicDelays(origin){
  var cols = +mosaicBox.dataset.cols, rows = +mosaicBox.dataset.rows;
  var W = window.innerWidth, H = window.innerHeight;
  var ox = (origin && origin.x) || W/2, oy = (origin && origin.y) || H/2;
  var maxD = Math.hypot(Math.max(ox, W-ox), Math.max(oy, H-oy));
  var kids = mosaicBox.children;
  for (var i=0; i<kids.length; i++){
    var cx = ((i % cols) + .5) * W/cols, cy = (Math.floor(i/cols) + .5) * H/rows;
    kids[i].style.transitionDelay = (Math.hypot(cx-ox, cy-oy)/maxD * 0.42).toFixed(2) + 's';
  }
}

function coverScreen(origin, cb){
  curtain.classList.remove('open');
  if (TRANSITION === 'mosaic'){ buildMosaic(); mosaicDelays(origin); }
  curtain.classList.add('cover');
  if (TRANSITION === 'wave') waveAnim('cover', 760, cb);
  else if (TRANSITION === 'mosaic') setTimeout(cb, 1170);
  else setTimeout(cb, 720);
}
function openScreen(origin, cb){
  curtain.classList.remove('cover');
  curtain.classList.add('open');
  if (TRANSITION === 'wave') waveAnim('open', 840, cb);
  else if (TRANSITION === 'mosaic') setTimeout(cb, 1220);
  else setTimeout(cb, 800);
}

var pendingNav = null;
function transitionTo(id, target, origin){
  if (busy){ pendingNav = { id: id, target: target, origin: origin }; return; }
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    if (PANEL_MODE){ showPanel(id); window.scrollTo({ top: 0, behavior: 'auto' }); }
    else window.scrollTo({ top: sectionTop(id, target), behavior: 'auto' });
    return;
  }
  busy = true;
  curtainLabel.textContent = SEC_LABEL[id] ? S(SEC_LABEL[id]) : '';
  coverScreen(origin, function(){
    if (PANEL_MODE){
      showPanel(id);
      window.scrollTo({ top: 0, behavior: 'auto' });
    } else {
      window.scrollTo({ top: sectionTop(id, target), behavior: 'auto' });
    }
    prepReplay(id, target);
    tlProgress();
    setTimeout(function(){
      playReplay(id, target);
      openScreen(origin, function(){
        curtain.classList.remove('open');
        busy = false;
        if (pendingNav){
          var nx = pendingNav; pendingNav = null;
          transitionTo(nx.id, nx.target, nx.origin);
        }
      });
    }, 300);
  });
}

/* ξαναστήνει τα στοιχεία της ενότητας ώστε να ξαναπαίξουν την είσοδό τους */
function prepReplay(id, target){
  if (id === 'top') return;
  var rvs = target.querySelectorAll('[data-rv]');
  for (var i=0;i<rvs.length;i++){
    if (io) io.unobserve(rvs[i]);
    rvs[i].classList.add('rv');
    rvs[i].classList.remove('in');
    rvs[i].style.transitionDelay = Math.min(i*0.06, 0.45).toFixed(2) + 's';
  }
  var cvs = target.querySelectorAll('.cv');
  for (var j=0;j<cvs.length;j++) cvs[j].textContent = '0';
  void target.offsetWidth; /* reflow */
}
function playReplay(id, target){
  if (id === 'top'){
    /* το hero ξαναπαίζει τα animations φόρτωσης */
    var els = document.querySelectorAll('.hero-kicker,.hero h1,.hero-sub,.cta-row,.hero-art .stage svg,#heroTitle .tri');
    for (var i=0;i<els.length;i++){
      els[i].style.animation = 'none';
    }
    void document.body.offsetWidth;
    for (var k=0;k<els.length;k++){
      els[k].style.animation = '';
    }
    return;
  }
  var rvs = target.querySelectorAll('[data-rv]');
  for (var i=0;i<rvs.length;i++){
    rvs[i].classList.add('in');
    settle(rvs[i]);
  }
  var cvs = target.querySelectorAll('.cv');
  for (var j=0;j<cvs.length;j++) countUp(cvs[j], +cvs[j].getAttribute('data-cv'));
}

function barWatch(box){
  /* οι μπάρες γεμίζουν όταν η ενότητα φανεί στην οθόνη */
  var bars = Array.prototype.slice.call(box.querySelectorAll('[data-w]'));
  if (!bars.length) return;
  var fill = function(){ bars.forEach(function(b){ b.style.width = b.getAttribute('data-w'); }); };
  if (!('IntersectionObserver' in window)){ fill(); return; }
  var ob = new IntersectionObserver(function(entries){
    entries.forEach(function(e){ if (e.isIntersecting){ fill(); ob.disconnect(); } });
  }, { threshold: 0.2 });
  ob.observe(box);
}
function renderImpact(){
  var box = document.getElementById('impactBox');
  if (!box) return;
  if (typeof IMPACT === 'undefined' || !IMPACT.show || !IMPACT.items.length){ box.innerHTML = ''; return; }
  var cards = IMPACT.items.map(function(it){
    var unit = T(it.unit) ? ' ' + esc(T(it.unit)) : '';
    var pct = (it.target && it.value) ? Math.min(100, Math.round(it.value / it.target * 100)) : 0;
    return '<div class="imp-card">' +
      '<b' + (it.value ? '' : ' class="waiting"') + '>' + (it.value ? fnum(it.value) + unit : '—') + '</b>' +
      '<span>' + esc(T(it.label)) + '</span>' +
      (it.value ? '' : '<span class="imp-goal">' + esc(S('imp_none')) + '</span>') +
      (it.target ? '<div class="imp-bar"><i data-w="' + pct + '%"></i></div>' +
                   '<span class="imp-goal">' + esc(S('imp_goal')) + ': ' + fnum(it.target) + unit + '</span>' : '') +
      '</div>';
  }).join('');
  box.innerHTML = '<div class="imp rv"><h3>' + esc(S('h_impact')) + '</h3>' +
                  '<p>' + esc(S('p_impact')) + '</p>' +
                  '<div class="imp-grid">' + cards + '</div></div>';
  barWatch(box);
}

function renderBring(){
  var box = document.getElementById('bringBox');
  if (!box) return;
  if (typeof BRING_BACK === 'undefined' || !BRING_BACK.show || !BRING_BACK.items.length){
    box.innerHTML = ''; return;
  }
  var cards = BRING_BACK.items.map(function(it){
    var ttl = T(it.title || {}), txt = T(it.text || {});
    var body = (ttl || txt)
      ? (ttl ? '<h4>' + esc(ttl) + '</h4>' : '') + (txt ? '<p>' + esc(txt) + '</p>' : '')
      : '<span class="brg-tag">' + esc(S('brg_soon')) + '</span>' +
        '<span class="brg-ph" aria-hidden="true"><i></i><i></i><i></i></span>';
    return '<div class="brg-card' + ((ttl || txt) ? '' : ' is-wait') +

      '<span class="brg-art">' + brgArt(it.art) + '</span>' +

var ctTimer = null;
function ctTick(target){
  var box = document.getElementById('ctClock');
  if (!box) { if (ctTimer) clearInterval(ctTimer); ctTimer = null; return; }
  var ms = Math.max(0, target - Date.now());
  var d = Math.floor(ms / 86400000);
  var h = Math.floor(ms / 3600000) % 24;
  var m = Math.floor(ms / 60000) % 60;
  var sec = Math.floor(ms / 1000) % 60;
  var cells = box.querySelectorAll('b');
  var vals = [d, h, m, sec];
  for (var i = 0; i < cells.length; i++){
    var v = String(vals[i]);
    if (i > 0 && v.length < 2) v = '0' + v;
    if (cells[i].textContent !== v) cells[i].textContent = v;
  }
}
function renderCountdown(){
  var box = document.getElementById('countdown');
  if (!box) return;
  if (ctTimer){ clearInterval(ctTimer); ctTimer = null; }
  box.innerHTML = '';
  if (typeof NEXT_TRIP === 'undefined' || !NEXT_TRIP.show) return;
  var ev = nextEvent();
  if (!ev) return;

  var a = dparse(ev.from), b = dparse(ev.to) || a;
  var idx = TIMELINE.indexOf(ev);
  var host = ev.kind === 'host';
  /* οι σημαίες δείχνουν την κατεύθυνση: ποιος πάει πού */
  var flags = host
    ? FLAG(ev.flag, 26) + ICONS.arrow + FLAG('gr', 26)
    : FLAG('gr', 26) + ICONS.arrow + FLAG(ev.flag, 26);
  var unitTxt = [S('u_days'), S('u_hours'), S('u_min'), S('u_sec')];
  var cells = unitTxt.map(function(u){
    return '<span class="ct-cell"><b>0</b><i>' + esc(u) + '</i></span>';
  }).join('<span class="ct-sep">:</span>');
  var days = Math.round((a - today0()) / 86400000);

  box.innerHTML =
    '<a class="cd" href="#timeline" data-focus="tl-' + idx + '" ' +
       'aria-label="' + esc(T(ev.title)) + ' — ' + esc(S('ct_go')) + '">' +
      '<span class="cd-top">' +
        '<span class="cd-flags" aria-hidden="true">' + flags + '</span>' +
        '<span class="cd-lbl">' + esc(S(host ? 'ct_lbl_host' : 'ct_lbl')) + '</span>' +
      '</span>' +
      '<span class="cd-title">' + esc(T(ev.title)) + '</span>' +
      '<span class="cd-when">' + esc(dateRange(a, b)) +
        (ev.who ? ' · ' + esc(T(ev.who)) : '') + '</span>' +
      '<span class="ct-clock" id="ctClock" aria-hidden="true">' + cells + '</span>' +
      '<span class="sr-only">' + esc(S('ct_in')) + ' ' + fnum(days) + ' ' + esc(S('u_days')) + '</span>' +
      '<span class="cd-go">' + esc(S('ct_go')) + ICONS.arrow + '</span>' +
    '</a>';

  ctTick(a.getTime());
  ctTimer = setInterval(function(){ ctTick(a.getTime()); }, 1000);
}
/* κλικ στην αντίστροφη μέτρηση: ανοίγει το χρονολόγιο στον σωστό σταθμό */
document.addEventListener('click', function(e){
  var a = e.target.closest ? e.target.closest('[data-focus]') : null;
  if (!a) return;
  var id = a.getAttribute('data-focus');
  setTimeout(function(){
    var node = document.getElementById(id);
    if (!node) return;
    node.scrollIntoView({ behavior: 'smooth', block: 'center' });
    node.classList.add('flash');
    setTimeout(function(){ node.classList.remove('flash'); }, 2200);
  }, 1500);
});

function renderLatest(){
  var box = document.getElementById('heroLatest');
  if (!box) return;
  var list = allActs();
  var latest = list.filter(function(a){ return scopeOf(a) === 'new'; })[0] || list[0];
  if (!latest){ box.innerHTML = ''; return; }
  box.innerHTML =
    '<button class="latest" type="button">' +
      (latest.img ? '<span class="latest-thumb"><img src="' + esc(latest.img) + '" alt=""></span>' : '') +
      '<span class="latest-txt">' +
        '<span class="latest-lbl">' + esc(S('latest_label')) + '</span>' +
        '<span class="latest-title">' + esc(T(latest.title)) + '</span>' +
      '</span>' +
      '<span class="latest-arr">' + ICONS.arrow + '</span>' +
    '</button>';
  box.querySelector('.latest').addEventListener('click', function(){ openReader(latest); });
}

/* σύνδεσμοι «Επόμενο» στο τέλος κάθε ενότητας */
var PANEL_ORDER = ['top','project','planet','timeline','activities','history','gallery'];
function addNextLinks(){
  if (!PANEL_MODE) return;
  panels.forEach(function(sec){
    var id = sec.getAttribute('data-panel');
    if (id === 'top' || sec.querySelector('.next-link')) return;
    var wrap = sec.querySelector('.wrap');
    if (!wrap) return;
    var b = document.createElement('button');
    b.className = 'next-link';
    b.type = 'button';
    b.innerHTML = '<span class="next-lbl"></span><span class="next-name"></span>' +
      '<span class="next-arr"><svg width="15" height="15" viewBox="0 0 12 12" fill="none"><path d="M1 6h10M7 2l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
    wrap.appendChild(b);
    b.addEventListener('click', function(e){
      var nid = nextOf(id);
      transitionTo(nid, document.getElementById(nid), { x: e.clientX, y: e.clientY });
    });
  });
  refreshNextLabels();
}
function nextOf(id){
  var i = PANEL_ORDER.indexOf(id);
  return PANEL_ORDER[(i + 1) % PANEL_ORDER.length];
}
function refreshNextLabels(){
  Array.prototype.slice.call(document.querySelectorAll('.next-link')).forEach(function(b){
    var id = b.closest('[data-panel]').getAttribute('data-panel');
    b.querySelector('.next-lbl').textContent = S('next_label');
    b.querySelector('.next-name').textContent = S(SEC_LABEL[nextOf(id)] || 'nav_home');
  });
}

/* ---------- λειτουργία χωρίς ίντερνετ (service worker) ----------
   Ενεργοποιείται μόνο όταν η σελίδα είναι ανεβασμένη σε https.
   Τοπικά, ανοίγοντας το αρχείο με διπλό κλικ, αγνοείται.            */
if ('serviceWorker' in navigator &&
    (location.protocol === 'https:' || location.hostname === 'localhost')){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){ /* δεν πειράζει */ });
  });
}
